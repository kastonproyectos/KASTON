    <!-- El Código de la App envuelto para compilación en caliente -->
    <script type="text/babel">
        const { useState, useMemo, useEffect, useRef } = React;
        const { jsPDF } = window.jspdf;
        const exchangeRates = {
            USD: 0.00025, // 1 COP a USD
            EUR: 0.00023, // 1 COP a EUR
            COP: 1
        };

        const KASTON_WEIGHT = 12.6; // kg por m2
        const KASTON_UNITS_PER_M2 = 42; // Fijo 42 uds por m2
        const KASTON_UNITS_PER_FT2 = 3.90; // 42 / 10.7639

        /* ─────────────────────────────────────────────────────────────
           PRECIOS POR m²  ·  actualizado agosto 2026
           ─────────────────────────────────────────────────────────────
           SOLO TEJA: precio único, no depende de la ubicación.
             Costo: teja 42 × $1.073 = $45.066 + costal $210 = $45.276/m²
             Venta: $85.000/m²  →  margen ~47%

           TODO COSTO: se arma sumando, no aplicando un markup al costo.
           La teja entra al PRECIO DE VENTA de $85.000 (no a costo): si el
           cliente que solo compra teja paga ese margen, el de todo costo
           también. Encima va la instalación con su propio margen.

             teja, a precio de venta ..... $85.000,00   (ya trae su margen y el costal)
             insumos de instalación ......  $9.335,41   (malla $6.345,41 + alambre $2.500
                                                         + grapas $300 + silicona $190;
                                                         el costal NO se repite acá)
             instalador ..... $45.000 hasta 25 km · $55.000 de 25 a 60 km
             ────────────────────────────────────────────────────────────
             + 25% de margen sobre (insumos + instalador)

             Hasta 25 km:  85.000 + 54.335,41 × 1,25 = $152.919  →  $153.000
             25 a 60 km:   85.000 + 64.335,41 × 1,25 = $165.419  →  $165.500

           OJO: dos costos que TODAVÍA NO están incluidos: el traslapo de la
           malla (sube el $6.345,41 si hay solape entre láminas) y el caballete.
           Si entran, hay que recalcular estos precios hacia arriba.
        ───────────────────────────────────────────────────────────────── */
        const PRECIO_SOLO_TEJA_M2 = 85000;

        // Origen para medir la distancia: planta de producción KASTON, Itagüí (Antioquia).
        // Si la planta se muda, cambiar estas coordenadas y todo lo demás se ajusta solo.
        const KASTON_ORIGEN = { lat: 6.1719, lng: -75.6114 };

        // Las zonas se evalúan en orden: gana la primera cuyo maxKm alcance.
        const ZONAS_TODO_COSTO = [
            {
                id: 'metro',
                maxKm: 25,
                instalador: 45000,
                costoM2: 99611.41,   // lo que REALMENTE pagas: teja $45.066 + insumos $9.545,41 + instalador
                precioM2: 153000     // 85.000 + (9.335,41 + 45.000) × 1,25  →  te quedan $53.389/m²
            },
            {
                id: 'afueras',
                maxKm: 60,
                instalador: 55000,
                costoM2: 109611.41,  // lo que REALMENTE pagas: teja $45.066 + insumos $9.545,41 + instalador
                precioM2: 165500     // 85.000 + (9.335,41 + 55.000) × 1,25  →  te quedan $55.889/m²
            },
            {
                id: 'lejana',
                maxKm: Infinity,
                instalador: null,
                costoM2: null,
                precioM2: null       // sin precio automático: pasa a un asesor
            }
        ];

        // Fuera de este radio ya no cotizamos solos: lo ve un asesor.
        const RADIO_AFUERAS_KM = 60;

        // Distancia en línea recta (Haversine) entre la planta y la obra, en km.
        const distanciaDesdePlanta = (lat, lng) => {
            const R = 6371;
            const rad = d => d * Math.PI / 180;
            const dLat = rad(lat - KASTON_ORIGEN.lat);
            const dLng = rad(lng - KASTON_ORIGEN.lng);
            const a = Math.sin(dLat / 2) ** 2 +
                      Math.cos(rad(KASTON_ORIGEN.lat)) * Math.cos(rad(lat)) * Math.sin(dLng / 2) ** 2;
            return 2 * R * Math.asin(Math.sqrt(a));
        };

        const zonaPorId = id => ZONAS_TODO_COSTO.find(z => z.id === id) || null;

        const zonaPorPunto = (lat, lng) => {
            const km = distanciaDesdePlanta(lat, lng);
            return ZONAS_TODO_COSTO.find(z => km <= z.maxKm) || ZONAS_TODO_COSTO[ZONAS_TODO_COSTO.length - 1];
        };

        const MATERIAL_CONSTANTS = {
            clay: { label: 'Teja de Barro', weight: 44.5, color: '#bd533b' },
            cement: { label: 'Teja de Fibrocemento', weight: 13.0, color: '#8da399' },
            zinc: { label: 'Lámina de Zinc', weight: 4.0, color: '#90a4ae' }
        };

        const PHONE_PREFIXES = [
            { code: '+57', name: 'Colombia' }, { code: '+1', name: 'EE.UU. / CAN' },
            { code: '+52', name: 'México' }, { code: '+54', name: 'Argentina' },
            { code: '+55', name: 'Brasil' }, { code: '+56', name: 'Chile' },
            { code: '+51', name: 'Perú' }, { code: '+58', name: 'Venezuela' },
            { code: '+593', name: 'Ecuador' }, { code: '+591', name: 'Bolivia' },
            { code: '+595', name: 'Paraguay' }, { code: '+598', name: 'Uruguay' },
            { code: '+507', name: 'Panamá' }, { code: '+503', name: 'El Salvador' },
            { code: '+502', name: 'Guatemala' }, { code: '+506', name: 'Costa Rica' },
            { code: '+1809', name: 'R. Dominicana' }, { code: '+34', name: 'España' },
            { code: '+44', name: 'Reino Unido' }, { code: '+49', name: 'Alemania' },
            { code: '+33', name: 'Francia' }, { code: '+39', name: 'Italia' },
            { code: '+971', name: 'Emiratos Árabes' }, { code: '+61', name: 'Australia' },
        ];

        const KASTON_COLORS = [
            { id: 'grafito', hex: '#2a2a2a', nameEs: 'Negro Grafito', nameEn: 'Graphite Black', descEs: 'Color estrella. Nuestra firma.', star: true },
            { id: 'basalto', hex: '#6b6b6b', nameEs: 'Gris Basalto',  nameEn: 'Basalt Gray',    descEs: 'Arquitectura moderna.',        star: false },
        ];

                                const ROOF_TYPES = [
  { id: "dos-aguas", name: "A Dos Aguas", nameEn: "Gable", imagePath: './Tipos de techos/dos-aguas.png', description: "Estructura de dos caras inclinadas que suben y se unen en el centro, formando un triángulo en el frente.", descEn: "Two sloped sides that rise and meet in the center, forming a triangle at the front." },
  { id: "cuatro-aguas", name: "A Cuatro Aguas", nameEn: "Hip", imagePath: './Tipos de techos/cuatro-aguas.png', description: "Estructura de cuatro caras inclinadas que bajan hacia cada esquina de la propiedad, sin dejar paredes altas.", descEn: "Four sloped sides descending toward each corner, with no tall walls." },
  { id: "mansarda", name: "Mansarda", nameEn: "Mansard", imagePath: './Tipos de techos/hastial-holandes.png', description: "Techo de cuatro lados con un quiebre de doble pendiente: muy empinado en la base y casi plano en la parte superior.", descEn: "Four-sided roof with a double-slope break: very steep at the base and nearly flat on top." },
  { id: "gambrel", name: "Gambrel / Tipo Granero", nameEn: "Gambrel / Barn", imagePath: './Tipos de techos/gambrel.png', description: "Techo que presenta dos pendientes laterales a cada lado, quebrándose hacia afuera en los costados.", descEn: "Roof with two side slopes on each side, breaking outward on the flanks." },
  { id: "bonete", name: "Techo con Bonete", nameEn: "Bonnet", imagePath: './Tipos de techos/bonete.png', description: "Techo a cuatro aguas que en la parte inferior cambia de inclinación, extendiéndose hacia afuera con una pendiente más plana.", descEn: "A hip roof that changes pitch near the bottom, extending outward with a flatter slope." },
  { id: "piramidal", name: "Techo Piramidal", nameEn: "Pyramid", imagePath: './Tipos de techos/cobertizo-alt.png', description: "Diseño de cuatro caras triangulares idénticas que suben de forma simétrica hasta unirse en una sola punta central.", descEn: "Four identical triangular faces rising symmetrically to a single central point." },
  { id: "hastial-holandes", name: "Hastial Holandés", nameEn: "Dutch Gable", imagePath: './Tipos de techos/mansarda.png', description: "Base inclinada a cuatro aguas que lleva un pequeño triángulo clásico montado en la parte más alta de la cumbrera.", descEn: "A hipped base with a small classic triangle mounted at the highest part of the ridge." },
  { id: "buhardilla", name: "Techo con Buhardilla", nameEn: "Dormer", imagePath: './Tipos de techos/piramidal.png', description: "Techo inclinado del cual sobresale una pequeña estructura vertical independiente con su propia ventana y tejado.", descEn: "A sloped roof with a small independent vertical structure (a dormer) with its own window and roof." },
  { id: "monitor", name: "Monitor", nameEn: "Monitor", imagePath: './Tipos de techos/monitor.png', description: "Techo interrumpido por un volumen central que se eleva hacia arriba y lleva ventanas rectangulares en los laterales.", descEn: "A roof interrupted by a central raised volume with rectangular windows on the sides." },
  { id: "cobertizo", name: "Cobertizo / Una Sola Vertiente", nameEn: "Skillion / Single Slope", imagePath: './Tipos de techos/hexagonal-copy.png', description: "Estructura compuesta por una sola rampa recta e inclinada que va de un extremo al otro de la construcción.", descEn: "A single straight, sloped ramp running from one end of the building to the other." },
  { id: "otro", name: "Otro / Diseño Especial", nameEn: "Other / Special Design", imagePath: null, description: "Estructuras personalizadas, techos curvos o configuraciones arquitectónicas complejas que no entran en los modelos estándar.", descEn: "Custom structures, curved roofs or complex architectural configurations outside the standard models." },
];

        /* ── Carga una imagen local para el PDF ── */
        const loadImageAsBase64 = (imageUrl) => new Promise((resolve) => {
            if (!imageUrl) { resolve(null); return; }
            try {
                const img = new Image();
                img.crossOrigin = 'anonymous';
                img.onload = () => {
                    try {
                        const canvas = document.createElement('canvas');
                        canvas.width = img.width || 300; canvas.height = img.height || 188;
                        const ctx = canvas.getContext('2d');
                        ctx.drawImage(img, 0, 0);
                        resolve(canvas.toDataURL('image/png'));
                    } catch(e) { resolve(null); }
                };
                img.onerror = () => resolve(null);
                img.src = new URL(imageUrl, window.location.href).href;
            } catch(e) { resolve(null); }
        });

        /* ── Carga el logo KASTON como PNG para incrustar en el PDF ── */
        const loadLogoForPDF = () => new Promise((resolve) => {
            try {
                const img = new Image();
                img.crossOrigin = 'anonymous';
                img.onload = () => {
                    try {
                        const canvas = document.createElement('canvas');
                        // Usar las dimensiones intrínsecas para preservar el aspect ratio real
                        const w = img.width || 360;
                        const h = img.height || 100;
                        canvas.width = w; 
                        canvas.height = h;
                        const ctx = canvas.getContext('2d');
                        ctx.drawImage(img, 0, 0, w, h);
                        resolve({ data: canvas.toDataURL('image/png'), aspect: w / h });
                    } catch(e) { resolve(null); }
                };
                img.onerror = () => resolve(null);
                img.src = new URL('logo-kaston.svg', window.location.href).href;
            } catch(e) { resolve(null); }
        });

        /* ── Constructor de PDF premium KASTON ── */
        const buildPremiumPDF = (doc, data, logoDataUrl) => {
            const {
                flow, area, unit, areaM2, material, currency, metrics, modality,
                roofType, pendiente, selectedColor, constructionType,
                clientName, clientPhone, clientDoc, clientRole,
                withObservation, includeZincWaiver, t, isSpecialDesign, roofPngUrl, selectedColorHex,
                zone, geoKm
            } = data;

            const C = {
                dark:   [13,  13,  13 ],
                bronze: [193, 138, 104],
                white:  [255, 255, 255],
                offWhite:[248,247,245 ],
                mid:    [160, 160, 160],
                dim:    [110, 110, 110],
                ink:    [30,  30,  30 ],
                stripe: [245, 244, 242],
                red:    [180, 60,  60 ],
            };
            const pageW = 210;
            const col1 = 18, col2 = 110;

            /* ── HEADER ── */
            doc.setFillColor(...C.dark);
            doc.rect(0, 0, pageW, 44, 'F');
            doc.setFillColor(...C.bronze);
            doc.rect(0, 44, pageW, 1.5, 'F');

            if (logoDataUrl) {
                // Soportar el nuevo objeto {data, aspect} o fallback a string viejo
                const data = typeof logoDataUrl === 'string' ? logoDataUrl : logoDataUrl.data;
                const aspect = logoDataUrl.aspect || 3.6; // Valor por defecto aproximado
                const logoH = 12; // Altura fija (h-12 equivalente)
                const logoW = logoH * aspect; // Ancho automático preservando proporción
                doc.addImage(data, 'PNG', col1, 10 + (13.3 - logoH)/2, logoW, logoH);
            } else {
                doc.setFont('helvetica', 'bold');
                doc.setFontSize(20);
                doc.setTextColor(...C.white);
                doc.text('KASTON', col1, 22);
            }

            doc.setFont('helvetica', 'normal');
            doc.setFontSize(8);
            doc.setTextColor(...C.bronze);
            doc.text(t.pdfReportTitle, col1, logoDataUrl ? 27 : 30);

            const dateStr = new Date().toLocaleDateString('es-CO', { year:'numeric', month:'long', day:'numeric' });
            doc.setFontSize(7.5);
            doc.setTextColor(...C.mid);
            doc.text(dateStr, pageW - col1, 38, { align: 'right' });

            /* ── BANDA CLIENTE ── */
            doc.setFillColor(...C.stripe);
            doc.rect(0, 45.5, pageW, 14, 'F');
            doc.setFont('helvetica', 'bold');
            doc.setFontSize(6.5);
            doc.setTextColor(...C.dim);
            doc.text(t.pdfClientData, col1, 51);
            doc.setFont('helvetica', 'normal');
            doc.setFontSize(7.5);
            doc.setTextColor(...C.ink);
            const clientLine = `${t.pdfClientName} ${clientName}  ·  ${t.pdfClientPhone} ${clientPhone}  ·  ${t.pdfClientDoc} ${clientDoc}  ·  ${clientRole}`;
            doc.text(clientLine, col1, 56.5);

            /* ── helper: cabecera de sección ── */
            let y = 65;
            const sectionHeader = (label) => {
                doc.setFillColor(...C.bronze);
                doc.rect(col1, y, 3, 5, 'F');
                doc.setFont('helvetica', 'bold');
                doc.setFontSize(10);
                doc.setTextColor(...C.ink);
                doc.text(label, col1 + 5, y + 4);
                y += 10;
            };
            const row = (label, value, bold = false) => {
                doc.setFont('helvetica', bold ? 'bold' : 'normal');
                doc.setFontSize(8.5);
                doc.setTextColor(...C.dim);
                doc.text(label, col1 + 4, y);
                doc.setFont('helvetica', bold ? 'bold' : 'normal');
                doc.setTextColor(...C.ink);
                doc.text(String(value), col2, y);
                y += 6;
            };
            const divider = () => {
                doc.setDrawColor(...C.bronze);
                doc.setLineWidth(0.3);
                doc.line(col1, y, pageW - col1, y);
                y += 5;
            };

            const activeRoof = ROOF_TYPES.find(r => r.id === roofType);
            const pendienteLabel = pendiente === null || pendiente === undefined
                ? t.pitchUnknown
                : `${pendiente}%`;
            const colorLabel = KASTON_COLORS.find(c => c.id === selectedColor)?.nameEs || 'Sin definir';
            const matLabel = MATERIAL_CONSTANTS[material]?.label || material;

            /* ── SECCIÓN 1: CONFIGURACIÓN ── */
            sectionHeader(t.pdfP1);
            row(t.pdfRoofArea, `${area} ${unit}  (≈ ${areaM2.toFixed(1)} m²)`);
            row(t.pdfConstrType, constructionType);
            if (flow === 'A') row(t.pdfP1TradMat, matLabel);
            row(t.pdfRoofTypeLabel, activeRoof ? (activeRoof.name) : 'Sin definir');
            row(t.pdfPendienteLabel, pendienteLabel);
            
            // Render color with a hex block if available
            doc.setFont('helvetica', 'normal');
            doc.setFontSize(8.5);
            doc.setTextColor(...C.dim);
            doc.text(t.pdfColorLabel, col1 + 4, y);
            doc.setTextColor(...C.ink);
            doc.text(colorLabel, col2, y);
            if (selectedColorHex) {
                doc.setFillColor(selectedColorHex);
                doc.rect(col2 + doc.getTextWidth(colorLabel) + 3, y - 2.5, 4, 4, 'F');
                doc.setDrawColor(...C.mid);
                doc.setLineWidth(0.1);
                doc.rect(col2 + doc.getTextWidth(colorLabel) + 3, y - 2.5, 4, 4, 'S');
            }
            y += 6;

            if (roofPngUrl) {
                y += 4;
                doc.setDrawColor(230, 230, 230);
                doc.setFillColor(250, 250, 250);
                doc.setLineWidth(0.5);
                doc.rect(col1, y, pageW - col1 * 2, 45, 'FD'); // Caja contenedora
                
                doc.setFont('helvetica', 'bold');
                doc.setFontSize(8);
                doc.setTextColor(...C.dim);
                doc.text('ILUSTRACIÓN DE REFERENCIA', col1 + 5, y + 6);
                
                // Centrar la imagen dentro del contenedor
                const imgW = 60;
                const imgH = 37;
                doc.addImage(roofPngUrl, 'PNG', (pageW - imgW) / 2, y + 4, imgW, imgH);
                y += 50;
            }

            divider();

            /* ── SECCIÓN 2: INVENTARIO & FINANCIERO ── */
            if (isSpecialDesign) {
                sectionHeader('DISEÑO ARQUITECTÓNICO ESPECIAL');
                doc.setFont('helvetica', 'normal');
                doc.setFontSize(9);
                doc.setTextColor(...C.ink);
                doc.text('Este proyecto requiere una Revisión de Consultoría de Ingeniería Personalizada. Debido a la complejidad y características únicas de su estructura, hemos omitido los cálculos estándar. Un ingeniero especializado de KASTON se pondrá en contacto con usted para realizar una evaluación técnica detallada.', col1 + 4, y, { maxWidth: pageW - col1 * 2 - 8, lineHeightFactor: 1.5 });
                y += 20;
                divider();
            } else {
                if (flow === 'A') {
                    sectionHeader(t.pdfP2);
                    row(t.pdfReqUnits, `${metrics.units} uds`, true);
                    divider();
                    sectionHeader(t.pdfP3);
                    row(t.pdfDeadLoadRelief, `${metrics.weightSavedTons} ${t.pdfTonsEl}`, true);
                    divider();
                } else {
                    sectionHeader(t.pdfSpecTitle);
                    row(t.pdfRollThick, '8 mm espesor, estabilizado UV');
                    divider();
                    sectionHeader(t.pdfP2Req);

        const formatCurrency = (value, currency = 'COP') => {
            let num = Number(value);
            if (isNaN(num)) return value;
            return num.toLocaleString('es-CO', {
                minimumFractionDigits: currency === 'COP' ? 0 : 2,
                maximumFractionDigits: currency === 'COP' ? 0 : 2
            }).replace(/,/g, '.');
        };

        const calculateMetrics = (m2, materialType = 'clay', currency = 'COP', rates = exchangeRates, zone = null) => {
            const units = m2 * KASTON_UNITS_PER_M2; // Sin margen de desperdicio 3%
            const selectedMaterial = MATERIAL_CONSTANTS[materialType] || MATERIAL_CONSTANTS.clay;
            const traditionalWeight = m2 * selectedMaterial.weight;
            const kastonWeight = m2 * KASTON_WEIGHT;
            const weightSavedKg = traditionalWeight - kastonWeight;
            const weightSavedTons = weightSavedKg / 1000;

            // La teja sola tiene precio único; el todo costo depende de la zona de la obra.
            const tarifaTodoCosto = zone && zone.precioM2 ? zone.precioM2 : null;

            let costOnlyTejaCOP = m2 * PRECIO_SOLO_TEJA_M2;
            let rate = rates[currency] || 1;
            let finalCostOnlyTeja = costOnlyTejaCOP * rate;
            // null = zona sin precio automático (más de 60 km): la cotiza un asesor.
            let finalCostTodoCosto = tarifaTodoCosto === null ? null : m2 * tarifaTodoCosto * rate;

            const plasticUpcycled = m2 * 12.6;
            const co2Reduced = m2 * 18.5;

            return {
                units: Math.ceil(units),
                weightSavedTons: Number(weightSavedTons.toFixed(2)),
                finalCost: Number(finalCostOnlyTeja.toFixed(2)),
                finalCostTodoCosto: finalCostTodoCosto === null ? null : Number(finalCostTodoCosto.toFixed(2)),
                tarifaTodoCosto,
                plasticUpcycled: Number(plasticUpcycled.toFixed(1)),
                co2Reduced: Number(co2Reduced.toFixed(1))
            };
        };

        // Animación del número suave
        function AnimatedNumber({ value, decimals = 0 }) {
            const [current, setCurrent] = useState(value);

            useEffect(() => {
                let frame;
                const speed = 0.15;
                const update = () => {
                    setCurrent(prev => {
                        const diff = value - prev;
                        if (Math.abs(diff) < 0.1) return value;
                        return prev + diff * speed;
                    });
                    frame = requestAnimationFrame(update);
                };
                frame = requestAnimationFrame(update);
                return () => cancelAnimationFrame(frame);
            }, [value]);

            return <span>{current.toFixed(decimals)}</span>;
        }

        function Gauge({ value, max, label, sublabel, color, decimals = 0, suffix = '', prefix = '' }) {
            const size = 160;
            const strokeWidth = 12;
            const radius = (size - strokeWidth) / 2;
            const circumference = radius * 2 * Math.PI;
            const percentage = Math.min((value / max) * 100, 100);
            const offset = circumference - (percentage / 100) * circumference;

            return (
                <div className="flex flex-col items-center relative gap-2">
                    <div className="relative" style={{ width: size, height: size }}>
                        <svg className="w-full h-full transform -rotate-90" width={size} height={size} viewBox={`0 0 ${size} ${size}`}>
                            <circle cx={size / 2} cy={size / 2} r={radius} strokeWidth={strokeWidth} stroke="rgba(255,255,255,0.1)" fill="none" />
                            <circle
                                cx={size / 2} cy={size / 2} r={radius}
                                strokeWidth={strokeWidth} stroke={color} fill="none" strokeLinecap="round"
                                style={{
                                    strokeDasharray: circumference,
                                    strokeDashoffset: offset,
                                    transition: 'stroke-dashoffset 0.8s cubic-bezier(0.4, 0, 0.2, 1)',
                                    filter: `drop-shadow(0 0 8px ${color}80)`
                                }}
                            />
                        </svg>
                        <div className="absolute inset-0 flex flex-col items-center justify-center pointer-events-none">
                            <span className="text-2xl font-bold tracking-tight text-white drop-shadow-md" style={{ color }}>
                                {prefix}<AnimatedNumber value={value} decimals={decimals} />{suffix}
                            </span>
                            <span className="text-xs text-white/50">{sublabel}</span>
                        </div>
                    </div>
                    {label && <div className="text-sm font-semibold tracking-wide text-white uppercase text-center mt-2">{label}</div>}
                    {sublabel && <div className="text-[10px] text-white/50 uppercase tracking-widest text-center">{sublabel}</div>}
                </div>
            );
        }

        function InfoTooltip({ title, description, technicalValue }) {
            const [isVisible, setIsVisible] = useState(false);
            const iconRef = useRef(null);
            const tooltipRef = useRef(null);
            const [position, setPosition] = useState({ top: 0, left: 0, isBelow: false });

            useEffect(() => {
                if (isVisible && iconRef.current) {
                    const rect = iconRef.current.getBoundingClientRect();
                    const topSpace = rect.top;

                    // Defaults
                    let isBelow = false;
                    let top = rect.top - 10; // 10px spacing above the icon

                    // Smart Collision: If less than 150px space above, render BELOW the icon
                    if (topSpace < 150) {
                        isBelow = true;
                        top = rect.bottom + 10;
                    }

                    // Smart Collision: Horizontal Centering & Window Bounds
                    let left = rect.left + (rect.width / 2); // Center of icon
                    const assumedTooltipWidth = 240; // max-w-xs approx width handling

                    if (left - (assumedTooltipWidth / 2) < 20) {
                        left = 20 + (assumedTooltipWidth / 2);
                    } else if (left + (assumedTooltipWidth / 2) > window.innerWidth - 20) {
                        left = window.innerWidth - 20 - (assumedTooltipWidth / 2);
                    }

                    setPosition({ top, left, isBelow });
                }
            }, [isVisible]);

            return (

        /* =============================================

           ============================================= */
        function PhoneInput({ value, onChange, language, required }) {
            const detect = (v) => {
                if (!v) return { prefix: '+57', number: '' };
                const match = PHONE_PREFIXES.slice().sort((a,b) => b.code.length - a.code.length)
                    .find(p => v.startsWith(p.code));
                if (match) return { prefix: match.code, number: v.slice(match.code.length).trim() };
                return { prefix: '+57', number: v };
            };
            const init = detect(value);
            const [prefix, setPrefix] = useState(init.prefix);
            const [number, setNumber] = useState(init.number);

            const emit = (p, n) => onChange(`${p} ${n}`);
            const onPfx = (e) => { setPrefix(e.target.value); emit(e.target.value, number); };
            const onNum = (e) => { const n = e.target.value.replace(/\D/g,''); setNumber(n); emit(prefix, n); };

            return (
                <div className="flex gap-2">
                    <select value={prefix} onChange={onPfx}
                        className="bg-black/50 border border-white/10 rounded-xl p-3 text-white focus:outline-none focus:border-bronze transition-all shadow-inner cursor-pointer appearance-none text-sm"
                        style={{ minWidth:'130px' }}>
                        {PHONE_PREFIXES.map(p => (
                            <option key={p.code} value={p.code} className="bg-graphite">{p.code} {p.name}</option>
                        ))}
                    </select>
                    <input type="tel" required={required} value={number} onChange={onNum}
                        className="flex-1 bg-black/50 border border-white/10 rounded-xl p-3 text-white focus:outline-none focus:border-bronze focus:ring-1 focus:ring-bronze transition-all shadow-inner"
                        placeholder="300 000 0000" />
                </div>
            );
        }

        const resizeToBase64 = (file) => new Promise((resolve) => {
            const reader = new FileReader();
            reader.onloadend = () => {
                const img = new Image();
                img.onload = () => {
                    const MAX = 300;
                    const ratio = Math.min(MAX / img.width, MAX / img.height, 1);
                    const canvas = document.createElement('canvas');
                    canvas.width  = Math.round(img.width  * ratio);
                    canvas.height = Math.round(img.height * ratio);
                    canvas.getContext('2d').drawImage(img, 0, 0, canvas.width, canvas.height);
                    resolve(canvas.toDataURL('image/jpeg', 0.75));
                };
                img.src = reader.result;
            };
            reader.readAsDataURL(file);
        });
