                                    <div className="flex items-center gap-3">
                                        <div className="w-8 h-8 rounded bg-bronze text-[#0D0D0D] flex items-center justify-center font-bold shadow-[0_0_15px_rgba(193,138,104,0.5)]">K</div>
                                        <h1 className="text-xl font-bold tracking-wider">KASTON</h1>
                                    </div>
                                )}
                            </div>
                            <div className="flex items-center gap-3 ml-auto flex-shrink-0">
                                <div className="flex bg-transparent border border-white/20 rounded-full overflow-hidden">
                                    <button onClick={() => handleLanguageChange('es')} className={`px-3 py-1 text-xs transition-colors cursor-pointer ${language === 'es' ? 'bg-bronze text-graphite font-bold' : 'text-white/50 hover:text-white'}`}>ES</button>
                                    <button onClick={() => handleLanguageChange('en')} className={`px-3 py-1 text-xs transition-colors cursor-pointer ${language === 'en' ? 'bg-bronze text-graphite font-bold' : 'text-white/50 hover:text-white'}`}>EN</button>
                                </div>
                                {session && (
                                    <button onClick={() => { onLogout(); setCurrentTab('profile'); }} className="text-xs text-white/30 hover:text-bronze uppercase tracking-widest transition-colors cursor-pointer border border-white/10 hover:border-bronze px-3 py-1 rounded">{t.logout}</button>
                                )}
                            </div>
                        </div>
                    </header>

                    <main className="w-full flex-grow flex flex-col items-center py-10 px-4 md:px-6" style={{ overflowY: 'visible' }}>
                        {currentTab === 'triage' && <TriageScreen language={language} onSelectFlow={(flow) => {
                            setTriageFlow(flow);
                            setCurrentTab('dashboard');
                        }} />}
                        {currentTab === 'dashboard' && <CalculatorTab language={language} defaults={settings} onSaveProject={handleSaveProject} editingProject={editingProject} defaultFlow={triageFlow || 'A'} session={session} setCurrentTab={setCurrentTab} setTriageFlow={setTriageFlow} rates={rates} />}
                        {currentTab === 'projects' && (
                            (session || projects.length > 0)
                                ? <ProjectsTab language={language} session={session} projects={projects} onEditProject={handleEditProject} onDeleteProject={handleDeleteProject} onQuoteProject={handleQuoteProject} onWhatsAppQuoteProject={handleWhatsAppQuoteProject} rates={rates} setCurrentTab={setCurrentTab} />
                                : <div className="w-full flex-grow flex flex-col items-center justify-center p-8 mt-20 text-center animate-fade-in"><p className="text-white/50 tracking-widest uppercase mb-6 text-sm">{t.authReq}</p><h2 className="text-2xl font-bold text-white mb-8 border-b border-white/10 pb-4">{t.loginToView}</h2><button onClick={() => setCurrentTab('profile')} className="bg-bronze hover:bg-white text-graphite px-8 py-4 rounded-xl font-bold uppercase tracking-widest transition-colors cursor-pointer shadow-[0_0_20px_rgba(193,138,104,0.3)]">{t.goToProfile}</button></div>
                        )}
                        {currentTab === 'profile' && (
                            session ? <ProfileTab language={language} settings={settings} updateSettings={(newSets) => setSettings({ ...settings, ...newSets })} session={session} extraData={extraData} /> :
                                <AuthScreen language={language} onAuth={onAuth} />
                        )}
                    </main>

                    {/* Botón flotante WhatsApp */}
                    <a
                        href={`https://wa.me/573188978552?text=${encodeURIComponent("¡Hola! Estuve navegando en la página de KASTON y me interesa conocer más sobre sus techos. ¿Me podrían brindar un poco más de información?")}`}
                        target="_blank" rel="noopener noreferrer"
                        title="Chatear con KASTON por WhatsApp"
                        style={{
                            position: 'fixed',
                            bottom: '80px',
                            right: '20px',
                            zIndex: 60,
                            width: '56px',
                            height: '56px',
                            background: '#25D366',
                            borderRadius: '50%',
                            display: 'flex',
                            alignItems: 'center',
                            justifyContent: 'center',
                            boxShadow: '0 4px 16px rgba(37,211,102,0.45)',
                            textDecoration: 'none',
                            transition: 'transform 0.2s, box-shadow 0.2s',
                            flexShrink: 0
                        }}
                        onMouseEnter={e => { e.currentTarget.style.transform = 'scale(1.12)'; e.currentTarget.style.boxShadow = '0 6px 22px rgba(37,211,102,0.65)'; }}
                        onMouseLeave={e => { e.currentTarget.style.transform = 'scale(1)'; e.currentTarget.style.boxShadow = '0 4px 16px rgba(37,211,102,0.45)'; }}
                    >
                        <svg width="28" height="28" viewBox="0 0 24 24" fill="white"><path d="M17.472 14.382c-.297-.149-1.758-.867-2.03-.967-.273-.099-.471-.148-.67.15-.197.297-.767.966-.94 1.164-.173.199-.347.223-.644.075-.297-.15-1.255-.463-2.39-1.475-.883-.788-1.48-1.761-1.653-2.059-.173-.297-.018-.458.13-.606.134-.133.298-.347.446-.52.149-.174.198-.298.298-.497.099-.198.05-.371-.025-.52-.075-.149-.669-1.612-.916-2.207-.242-.579-.487-.5-.669-.51-.173-.008-.371-.01-.57-.01-.198 0-.52.074-.792.372-.272.297-1.04 1.016-1.04 2.479 0 1.462 1.065 2.875 1.213 3.074.149.198 2.096 3.2 5.077 4.487.709.306 1.262.489 1.694.625.712.227 1.36.195 1.871.118.571-.085 1.758-.719 2.006-1.413.248-.694.248-1.289.173-1.413-.074-.124-.272-.198-.57-.347m-5.421 7.403h-.004a9.87 9.87 0 01-5.031-1.378l-.361-.214-3.741.982.998-3.648-.235-.374a9.86 9.86 0 01-1.51-5.26c.001-5.45 4.436-9.884 9.888-9.884 2.64 0 5.122 1.03 6.988 2.898a9.825 9.825 0 012.893 6.994c-.003 5.45-4.437 9.884-9.885 9.884m8.413-18.297A11.815 11.815 0 0012.05 0C5.495 0 .16 5.335.157 11.892c0 2.096.547 4.142 1.588 5.945L.057 24l6.305-1.654a11.882 11.882 0 005.683 1.448h.005c6.554 0 11.89-5.335 11.893-11.893a11.821 11.821 0 00-3.48-8.413z"/></svg>
                    </a>

                    {/* Bottom Tab Bar */}
                    <div className="fixed bottom-0 left-0 right-0 glass-panel border-t border-white/10 p-2 z-50 flex justify-center pb-safe" style={{ boxShadow: '0 -10px 30px rgba(0,0,0,0.5)' }}>
                        <div className="max-w-md w-full flex justify-around items-center">
                            <button onClick={() => { setCurrentTab('triage'); setTriageFlow(null); }} className={`bottom-nav-btn flex flex-col items-center justify-center p-3 min-w-[6.5rem] w-auto rounded-lg transition-colors duration-300 min-h-[56px] ${currentTab === 'triage' || currentTab === 'dashboard' ? 'text-bronze' : 'text-white/40 hover:text-white/70'}`}>
                                <svg className="w-6 h-6 mb-1" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth={1.5} d="M4 6a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2H6a2 2 0 01-2-2V6zM14 6a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2h-2a2 2 0 01-2-2V6zM4 16a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2H6a2 2 0 01-2-2v-2zM14 16a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2h-2a2 2 0 01-2-2v-2z" /></svg>
                                <span className="text-[10px] uppercase font-bold tracking-widest">{t.bottomDash}</span>
                            </button>
                            <button onClick={() => setCurrentTab('projects')} className={`bottom-nav-btn flex flex-col items-center justify-center p-3 min-w-[6.5rem] w-auto rounded-lg transition-colors duration-300 relative min-h-[56px] ${currentTab === 'projects' ? 'text-bronze' : 'text-white/40 hover:text-white/70'}`}>
                                <svg className="w-6 h-6 mb-1" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth={1.5} d="M19 11H5m14 0a2 2 0 012 2v6a2 2 0 01-2 2H5a2 2 0 01-2-2v-6a2 2 0 012-2m14 0V9a2 2 0 00-2-2M5 11V9a2 2 0 002-2m0 0V5a2 2 0 012-2h6a2 2 0 012 2v2M7 7h10" /></svg>
                                <span className="text-[10px] uppercase font-bold tracking-widest">{t.bottomProj}</span>
                                {projects.length > 0 && <span className="absolute top-2 right-4 bg-bronze border border-graphite w-2 h-2 rounded-full"></span>}
                            </button>
                            <button onClick={() => setCurrentTab('profile')} className={`bottom-nav-btn flex flex-col items-center justify-center p-3 min-w-[6.5rem] w-auto rounded-lg transition-colors duration-300 min-h-[56px] ${currentTab === 'profile' ? 'text-bronze' : 'text-white/40 hover:text-white/70'}`}>
                                <svg className="w-6 h-6 mb-1" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth={1.5} d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z" /></svg>
                                <span className="text-[10px] uppercase font-bold tracking-widest">{t.bottomProf}</span>
                            </button>
                        </div>
                    </div>
                </div>
            );
        }

        function OAuthButtons({ loading, onOAuth, isEs, showGoogleBtn }) {
            return (
                <div className="flex flex-col gap-2">
                    <button type="button" onClick={() => onOAuth('google')} disabled={loading}
                        className="w-full flex items-center justify-center gap-3 bg-white/5 hover:bg-white/10 border border-white/10 hover:border-white/25 text-white py-3 px-4 rounded-xl transition-all cursor-pointer disabled:opacity-40 text-sm font-medium">
                        <svg className="w-4 h-4 flex-shrink-0" viewBox="0 0 24 24">
                            <path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" fill="#4285F4"/>
                            <path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"/>
                            <path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l3.66 2.84z" fill="#FBBC05"/>
                            <path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z" fill="#EA4335"/>
                        </svg>
                        {isEs ? 'Continuar con Google' : 'Continue with Google'}
                    </button>
                    {showGoogleBtn && (
                        <div id="google-rendered-btn" className="w-full flex justify-center" />
                    )}
                </div>
            );
        }

        function AuthScreen({ onAuth, language }) {
            const t = T[language] || T['es'];
            const isEs = language !== 'en';

            const [mode, setMode] = useState('login');
            const [step, setStep] = useState(1);

            // Login
            const [email, setEmail] = useState('');
            const [password, setPassword] = useState('');
            const [showPass, setShowPass] = useState(false);

            // Register
            const [fullName, setFullName] = useState('');
            const [phone, setPhone] = useState('');
            const [role, setRole] = useState('Propietario');
            const [idType, setIdType] = useState('Cédula de Ciudadanía');
            const [idNumber, setIdNumber] = useState('');
            const [profilePhoto, setProfilePhoto] = useState(null);
            const [photoPreview, setPhotoPreview] = useState(null);
            const [regEmail, setRegEmail] = useState('');
            const [regPassword, setRegPassword] = useState('');
            const [confirmPassword, setConfirmPassword] = useState('');
            const [showRegPass, setShowRegPass] = useState(false);

            const [loading, setLoading] = useState(false);
            const [error, setError] = useState(null);
            const [confirmMsg, setConfirmMsg] = useState(null);

            const switchMode = (m) => { setMode(m); setStep(1); setError(null); setConfirmMsg(null); };

            const GOOGLE_CLIENT_ID = '90020836207-82o12lfhkluhgbs4nh0rusv4b402j0gt.apps.googleusercontent.com';

            const [showGoogleBtn, setShowGoogleBtn] = useState(false);

            const onGoogleCredential = async (response) => {
                if (!response.credential) return;
                setLoading(true);
                setShowGoogleBtn(false);
                try {
                    const { data, error } = await supabase.auth.signInWithIdToken({
                        provider: 'google',
                        token: response.credential,
                    });
                    if (error) throw error;
                    onAuth(data.session, {});
                } catch (err) {
                    setError(err.message);
                } finally {
                    setLoading(false);
                }
            };

            const handleOAuth = (provider) => {
                if (provider !== 'google' || !window.google?.accounts?.id) {
                    setError(isEs ? 'Google no está disponible aún, intenta en unos segundos.' : 'Google not ready yet, try in a moment.');
                    return;
                }
                setError(null);
                setLoading(true);
                window.google.accounts.id.initialize({
                    client_id: GOOGLE_CLIENT_ID,
                    callback: onGoogleCredential,
                    use_fedcm_for_prompt: false,
                    auto_select: false,
                });
                window.google.accounts.id.prompt((notification) => {
                    if (notification.isNotDisplayed() || notification.isSkippedMoment()) {
                        // One Tap no disponible, mostrar botón oficial de Google
                        setLoading(false);
                        setShowGoogleBtn(true);
                        setTimeout(() => {
                            const container = document.getElementById('google-rendered-btn');
                            if (container) {
                                window.google.accounts.id.renderButton(container, {
                                    theme: 'outline',
                                    size: 'large',
                                    width: Math.min(container.offsetWidth || 380, 380),
                                    text: 'signin_with',
                                    logo_alignment: 'center',
                                });
                            }
                        }, 100);
                    }
                });
            };

            const handlePhotoChange = (e) => {
                const file = e.target.files[0];
                if (file) {
                    resizeToBase64(file).then(dataUrl => {
                        setPhotoPreview(dataUrl);
                        setProfilePhoto(dataUrl);
                    });
                }
            };

            const stepValid = {
                1: fullName.trim().length > 1 && phone.trim().length > 5 && idNumber.trim().length > 3,
                2: !!profilePhoto,
                3: regEmail.includes('@') && regPassword.length >= 6 && regPassword === confirmPassword
            };

            const handleLogin = async (e) => {
                e.preventDefault();
                setError(null);
                setLoading(true);
                try {
                    const { data, error } = await supabase.auth.signInWithPassword({ email, password });
                    if (error) throw error;
                    onAuth(data.session, {});
                } catch (err) {
                    setError(err.message === 'Invalid login credentials' ? t.errBadCreds : err.message);
                } finally {
                    setLoading(false);
                }
            };

            const handleNextStep = () => {
                if (step === 1) {
                    if (idType === 'Pasaporte') {
                        if (!/^[a-zA-Z]{2}\d+$/.test(idNumber)) { setError(t.errPassportFmt); return; }
                    } else {
                        if (!/^\d+$/.test(idNumber)) { setError(`${t.errDocPre} ${idType} ${t.errDocSuf}`); return; }
                    }
                }
                setError(null);
                setStep(s => s + 1);
            };

            const handleRegister = async () => {
                setError(null);
                if (!stepValid[3]) { setError(t.passMismatch); return; }
                setLoading(true);
                try {
                    const { data, error } = await supabase.auth.signUp({
                        email: regEmail, password: regPassword,
                        options: { data: { full_name: fullName, phone, role, id_type: idType, id_number: idNumber } }
                    });
                    if (error) throw error;
                    if (data.session) {
                        if (profilePhoto) {
                            await supabase.auth.updateUser({ data: { avatar_url: profilePhoto } });
                        }
                        onAuth(data.session, { fullName, phone, photoPreview, role, idType, idNumber });
                    } else {
                        setConfirmMsg(t.awaitConfirm);
                    }
                } catch (err) {
                    setError(err.message);
                } finally {
                    setLoading(false);
                }
            };

            const EyeIcon = ({ show }) => show
                ? <svg className="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M13.875 18.825A10.05 10.05 0 0112 19c-4.478 0-8.268-2.943-9.543-7a9.97 9.97 0 011.563-3.029m5.858.908a3 3 0 114.243 4.243M9.878 9.878l4.242 4.242M9.88 9.88l-3.29-3.29m7.532 7.532l3.29 3.29M3 3l3.59 3.59m0 0A9.953 9.953 0 0112 5c4.478 0 8.268 2.943 9.543 7a10.025 10.025 0 01-4.132 4.411m0 0L21 21" /></svg>
                : <svg className="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" /><path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z" /></svg>;

            const FieldLabel = ({ children }) => (
                <label className="block text-[10px] text-white/40 uppercase tracking-widest mb-1.5 font-semibold">{children}</label>
            );

            const inputCls = "w-full bg-white/5 border border-white/10 rounded-xl px-4 py-3 text-white placeholder-white/20 focus:outline-none focus:border-bronze transition-all text-sm";

            const Spinner = () => (
                <svg className="animate-spin w-4 h-4" fill="none" viewBox="0 0 24 24">
                    <circle className="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" strokeWidth="4"/>
                    <path className="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4z"/>
                </svg>
            );

            return (
                <div className="w-full min-h-[80vh] flex items-center justify-center p-4 py-10">
                    <div className="w-full max-w-md flex flex-col gap-6">

                        {/* Logo */}
                        <div className="flex justify-center">
                            {typeof KASTON_LOGO !== 'undefined'
                                ? <img src={KASTON_LOGO} alt="KASTON" style={{ height: '280px', width: 'auto', objectFit: 'contain', imageRendering: 'crisp-edges', filter: 'drop-shadow(0px 2px 4px rgba(0,0,0,0.2))' }} />
                                : <div className="flex items-center gap-2"><div className="w-8 h-8 rounded bg-bronze text-graphite flex items-center justify-center font-bold text-lg">K</div><span className="text-xl font-bold tracking-wider text-white">KASTON</span></div>
                            }
                        </div>

                        {/* Mode tabs */}
                        <div className="flex rounded-xl overflow-hidden border border-white/10 p-1 gap-1 bg-white/5">
                            {['login', 'register'].map(m => (
                                <button key={m} onClick={() => switchMode(m)}
                                    className={`flex-1 py-2.5 text-xs font-bold uppercase tracking-widest rounded-lg transition-all cursor-pointer ${mode === m ? 'bg-bronze text-graphite shadow-[0_0_15px_rgba(193,138,104,0.3)]' : 'text-white/40 hover:text-white'}`}>
                                    {m === 'login' ? (isEs ? 'Iniciar Sesión' : 'Sign In') : (isEs ? 'Crear Cuenta' : 'Register')}
                                </button>
                            ))}
                        </div>

                        {/* Alerts */}
                        {error && (
                            <div className="bg-red-500/10 border border-red-500/30 text-red-400 text-sm p-3 rounded-xl flex items-start gap-2">
                                <svg className="w-4 h-4 mt-0.5 flex-shrink-0" fill="currentColor" viewBox="0 0 20 20"><path fillRule="evenodd" d="M18 10a8 8 0 11-16 0 8 8 0 0116 0zm-7 4a1 1 0 11-2 0 1 1 0 012 0zm-1-9a1 1 0 00-1 1v4a1 1 0 102 0V6a1 1 0 00-1-1z" clipRule="evenodd" /></svg>
                                {error}
                            </div>
                        )}
                        {confirmMsg && (
                            <div className="bg-green-500/10 border border-green-500/30 text-green-400 text-sm p-4 rounded-xl flex items-start gap-2 leading-relaxed">
                                <svg className="w-4 h-4 mt-0.5 flex-shrink-0" fill="currentColor" viewBox="0 0 20 20"><path fillRule="evenodd" d="M10 18a8 8 0 100-16 8 8 0 000 16zm3.707-9.293a1 1 0 00-1.414-1.414L9 10.586 7.707 9.293a1 1 0 00-1.414 1.414l2 2a1 1 0 001.414 0l4-4z" clipRule="evenodd" /></svg>
                                {confirmMsg}
                            </div>
                        )}

                        {/* ── LOGIN ── */}
                        {mode === 'login' && (
                            <div className="flex flex-col gap-4">
                                <OAuthButtons loading={loading} onOAuth={handleOAuth} isEs={isEs} showGoogleBtn={showGoogleBtn} />
                                <div className="flex items-center gap-3">
                                    <div className="flex-1 h-px bg-white/10" />
                                    <span className="text-[10px] text-white/25 uppercase tracking-widest">{isEs ? 'o con correo' : 'or with email'}</span>
                                    <div className="flex-1 h-px bg-white/10" />
                                </div>
                                <form onSubmit={handleLogin} className="flex flex-col gap-4">
                                    <div>
                                        <FieldLabel>{t.emailAdd}</FieldLabel>
                                        <input type="email" required value={email} onChange={e => setEmail(e.target.value)} className={inputCls} placeholder={t.emailPlace} autoComplete="email" />
                                    </div>
                                    <div>
                                        <FieldLabel>{t.passLabel}</FieldLabel>
                                        <div className="relative">
                                            <input type={showPass ? 'text' : 'password'} required value={password} onChange={e => setPassword(e.target.value)} className={inputCls + ' pr-12'} placeholder={t.passPlace} autoComplete="current-password" />
                                            <button type="button" onClick={() => setShowPass(p => !p)} className="absolute right-4 top-1/2 -translate-y-1/2 text-white/30 hover:text-white/70 transition-colors cursor-pointer"><EyeIcon show={showPass} /></button>
                                        </div>
                                    </div>
                                    <button type="submit" disabled={loading} className="mt-1 w-full bg-bronze hover:bg-white text-graphite font-bold py-4 rounded-xl uppercase tracking-widest transition-all duration-200 cursor-pointer disabled:opacity-40 shadow-[0_0_20px_rgba(193,138,104,0.2)] flex items-center justify-center gap-2">
                                        {loading ? <><Spinner />{isEs ? 'Ingresando...' : 'Signing in...'}</> : t.enterDash}
                                    </button>
                                </form>
                            </div>
                        )}

                        {/* ── REGISTER ── */}
                        {mode === 'register' && (
                            <div className="flex flex-col gap-5">

                                {/* Step indicator */}
                                <div className="flex items-center gap-2">
                                    {[1, 2, 3].map(s => (
                                        <React.Fragment key={s}>
                                            <div className="flex items-center gap-2">
                                                <div className={`w-7 h-7 rounded-full flex items-center justify-center text-xs font-bold border-2 transition-all duration-300 ${s < step ? 'bg-bronze border-bronze text-graphite' : s === step ? 'border-bronze text-bronze bg-bronze/10' : 'border-white/15 text-white/20'}`}>
                                                    {s < step
                                                        ? <svg className="w-3.5 h-3.5" fill="currentColor" viewBox="0 0 20 20"><path fillRule="evenodd" d="M16.707 5.293a1 1 0 010 1.414l-8 8a1 1 0 01-1.414 0l-4-4a1 1 0 011.414-1.414L8 12.586l7.293-7.293a1 1 0 011.414 0z" clipRule="evenodd" /></svg>
                                                        : s}
                                                </div>
                                                <span className={`text-[9px] uppercase tracking-widest hidden sm:block transition-colors ${s === step ? 'text-bronze' : s < step ? 'text-white/40' : 'text-white/15'}`}>

        function App() {
            const [session, setSession] = useState(null);
            const [extraData, setExtraData] = useState({});
            const [loading, setLoading] = useState(true);
            const [authChecked, setAuthChecked] = useState(false);
            const [initLang] = useState(() => localStorage.getItem('kastonLang') || 'es');

            const handleAuth = (sess, extra = {}) => {
                setSession(sess);
                setExtraData(extra);
            };

            useEffect(() => {
                if (!supabase?.auth) {
                    setLoading(false);
                    setAuthChecked(true);
                    return;
                }

                const normalizeExtra = (session, prev) => {
                    const m = session?.user?.user_metadata || {};
                    return {
                        full_name:  m.full_name  || m.name    || prev?.full_name  || '',
                        phone:      m.phone                   || prev?.phone      || '',
                        role:       m.role                    || prev?.role       || 'Propietario',
                        id_type:    m.id_type                 || prev?.id_type    || '',
                        id_number:  m.id_number               || prev?.id_number  || '',
                        avatar_url: m.avatar_url || m.picture || prev?.avatar_url || '',
                        provider:   session?.user?.app_metadata?.provider || 'email'
                    };
                };

                // 1. onAuthStateChange primero, captura el SIGNED_IN del redirect OAuth
                const { data: { subscription } } = supabase.auth.onAuthStateChange((_event, session) => {
                    setSession(session);
                    setAuthChecked(true);
                    setLoading(false);
                    if (session) setExtraData(prev => normalizeExtra(session, prev));
                });

                // 2. getSession sin timeout, deja que Supabase procese el código OAuth de la URL
                supabase.auth.getSession()
                    .then(({ data: { session } }) => {
                        setSession(session);
                        if (session) setExtraData(prev => normalizeExtra(session, prev));
                    })
                    .catch(err => console.error('Auth init error:', err))
                    .finally(() => { setLoading(false); setAuthChecked(true); });

                return () => subscription.unsubscribe();
            }, []);

            if (loading || !authChecked) {
                return (
                    <div className="min-h-screen bg-graphite flex flex-col items-center justify-center gap-6">
                        <div className="w-16 h-16 rounded-full border-4 border-bronze border-t-transparent animate-spin"></div>
                        <p className="text-bronze uppercase tracking-widest font-bold text-sm">
                            {initLang === 'en' ? 'Initializing...' : 'Inicializando...'}
                        </p>
                    </div>
                );
            }

            return <MainDashboard session={session} extraData={extraData} onLogout={() => { if (supabase) supabase.auth.signOut(); setSession(null); setExtraData(null); }} onAuth={handleAuth} />;
        }
