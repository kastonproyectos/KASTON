                                ? <><svg className="animate-spin w-3.5 h-3.5" fill="none" viewBox="0 0 24 24"><circle className="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" strokeWidth="4"/><path className="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4z"/></svg>{isEs ? 'Guardando' : 'Saving'}</>
                                : <>{isEs ? 'Guardar cambios' : 'Save changes'} <svg className="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M5 13l4 4L19 7" /></svg></>
                            }
                        </button>
                    </div>

                    {/* Feedback */}
                    {feedback && (
                        <div className={`flex items-start gap-2 text-sm p-3 rounded-xl border ${feedback.type === 'success' ? 'bg-green-500/10 border-green-500/30 text-green-400' : 'bg-red-500/10 border-red-500/30 text-red-400'}`}>
                            {feedback.type === 'success'
                                ? <svg className="w-4 h-4 mt-0.5 flex-shrink-0" fill="currentColor" viewBox="0 0 20 20"><path fillRule="evenodd" d="M10 18a8 8 0 100-16 8 8 0 000 16zm3.707-9.293a1 1 0 00-1.414-1.414L9 10.586 7.707 9.293a1 1 0 00-1.414 1.414l2 2a1 1 0 001.414 0l4-4z" clipRule="evenodd" /></svg>
                                : <svg className="w-4 h-4 mt-0.5 flex-shrink-0" fill="currentColor" viewBox="0 0 20 20"><path fillRule="evenodd" d="M18 10a8 8 0 11-16 0 8 8 0 0116 0zm-7 4a1 1 0 11-2 0 1 1 0 012 0zm-1-9a1 1 0 00-1 1v4a1 1 0 102 0V6a1 1 0 00-1-1z" clipRule="evenodd" /></svg>
                            }
                            {feedback.text}
                        </div>
                    )}

                    {/* Foto */}
                    <div className="glass-panel rounded-2xl p-6 flex flex-col items-center gap-4">
                        <label className="cursor-pointer group flex flex-col items-center gap-3">
                            <div className="relative">
                                <Avatar size="lg" />
                                <div className="absolute bottom-0 right-0 w-8 h-8 bg-bronze rounded-full flex items-center justify-center text-graphite shadow-lg group-hover:scale-110 transition-transform">
                                    <svg className="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M3 9a2 2 0 012-2h.93a2 2 0 001.664-.89l.812-1.22A2 2 0 0110.07 4h3.86a2 2 0 011.664.89l.812 1.22A2 2 0 0018.07 7H19a2 2 0 012 2v9a2 2 0 01-2 2H5a2 2 0 01-2-2V9z" /><path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M15 13a3 3 0 11-6 0 3 3 0 016 0z" /></svg>
                                </div>
                            </div>
                            <span className="text-[10px] text-white/30 uppercase tracking-widest">{isEs ? 'Toca para cambiar foto' : 'Tap to change photo'}</span>
                            <input type="file" accept="image/*" onChange={handlePhotoChange} className="hidden" />
                        </label>
                    </div>

                    {/* Info de contacto */}
                    <div className="glass-panel rounded-2xl p-6 flex flex-col gap-4">
                        <p className="text-xs font-bold text-white/50 uppercase tracking-widest border-b border-white/10 pb-3">{isEs ? 'Información de contacto' : 'Contact info'}</p>
                        <div>
                            <FieldLabel>{t.phoneNum}</FieldLabel>
                            <input type="tel" value={phone} onChange={e => setPhone(e.target.value)} className={inputCls} placeholder="+57 300 000 0000" />
                        </div>
                        <div>
                            <FieldLabel>{t.idNum} · {idType}</FieldLabel>
                            <input type="text" value={idNumber} disabled className="w-full bg-white/3 border border-white/5 rounded-xl px-4 py-3 text-white/30 text-sm cursor-not-allowed" title="Inmutable por seguridad" />
                            <p className="text-[9px] text-white/20 mt-1 tracking-widest">{isEs ? 'El documento no puede modificarse.' : 'Document cannot be changed.'}</p>
                        </div>
                    </div>

                    {/* Cambiar contraseña */}
                    <div className="glass-panel rounded-2xl p-6 flex flex-col gap-4">
                        <p className="text-xs font-bold text-white/50 uppercase tracking-widest border-b border-white/10 pb-3">{t.secModule}</p>

                        {!passValidated ? (
                            <div className="flex flex-col gap-3">
                                <div>
                                    <FieldLabel>{t.currPass}</FieldLabel>
                                    <div className="relative">
                                        <input type={showCurrPass ? 'text' : 'password'} value={currentPassword} onChange={e => setCurrentPassword(e.target.value)} className={inputCls + ' pr-12'} placeholder={t.passPlace} />
                                        <EyeBtn show={showCurrPass} toggle={() => setShowCurrPass(p => !p)} />
                                    </div>
                                </div>
                                <button onClick={handleValidatePassword} disabled={validating || !currentPassword.trim()}
                                    className="w-full py-3 rounded-xl border border-white/15 hover:border-bronze text-white/50 hover:text-white text-xs uppercase tracking-widest transition-all cursor-pointer disabled:opacity-30 flex items-center justify-center gap-2">
                                    {validating ? <><svg className="animate-spin w-3.5 h-3.5" fill="none" viewBox="0 0 24 24"><circle className="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" strokeWidth="4"/><path className="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4z"/></svg>{isEs ? 'Verificando...' : 'Verifying...'}</> : t.valPass}
                                </button>
                            </div>
                        ) : (
                            <div className="flex flex-col gap-3 animate-fade-in">
                                <div className="flex items-center gap-2 bg-green-500/10 border border-green-500/25 text-green-400 text-xs p-3 rounded-xl">
                                    <svg className="w-4 h-4 flex-shrink-0" fill="currentColor" viewBox="0 0 20 20"><path fillRule="evenodd" d="M10 18a8 8 0 100-16 8 8 0 000 16zm3.707-9.293a1 1 0 00-1.414-1.414L9 10.586 7.707 9.293a1 1 0 00-1.414 1.414l2 2a1 1 0 001.414 0l4-4z" clipRule="evenodd" /></svg>
                                    {t.idVal}
                                </div>
                                <div>
                                    <FieldLabel>{t.newPass}</FieldLabel>
                                    <div className="relative">
                                        <input type={showNewPass ? 'text' : 'password'} value={newPassword} onChange={e => setNewPassword(e.target.value)} className={inputCls + ' pr-12'} placeholder={isEs ? 'Mínimo 6 caracteres' : 'Min. 6 characters'} />
                                        <EyeBtn show={showNewPass} toggle={() => setShowNewPass(p => !p)} />
                                    </div>
                                </div>
                                <div>
                                    <FieldLabel>{t.confPass}</FieldLabel>
                                    <input type={showNewPass ? 'text' : 'password'} value={confirmPassword} onChange={e => setConfirmPassword(e.target.value)}
                                        className={`${inputCls} border ${confirmPassword && newPassword !== confirmPassword ? 'border-red-500/50' : confirmPassword && newPassword === confirmPassword ? 'border-green-500/50' : 'border-white/10'}`}
                                        placeholder={t.passPlace} />
                                    {confirmPassword && newPassword === confirmPassword && newPassword.length >= 6 && (
                                        <p className="text-green-400 text-[10px] mt-1.5 flex items-center gap-1">
                                            <svg className="w-3 h-3" fill="currentColor" viewBox="0 0 20 20"><path fillRule="evenodd" d="M16.707 5.293a1 1 0 010 1.414l-8 8a1 1 0 01-1.414 0l-4-4a1 1 0 011.414-1.414L8 12.586l7.293-7.293a1 1 0 011.414 0z" clipRule="evenodd" /></svg>
                                            {isEs ? 'Contraseñas coinciden' : 'Passwords match'}
                                        </p>
                                    )}
                                </div>
                            </div>
                        )}
                    </div>
                </div>
            );

            /* ── VISTA DE PERFIL ── */
            const provider = session?.user?.app_metadata?.provider || extraData?.provider || 'email';
            const isOAuth = provider === 'google' || provider === 'apple';
            const profileIncomplete = isOAuth && !idNumber;

            return (
                <div className="w-full max-w-lg mx-auto flex flex-col gap-5 animate-fade-in">

                    {/* Banner perfil incompleto para usuarios OAuth */}
                    {profileIncomplete && (
                        <div className="flex items-start gap-3 bg-bronze/10 border border-bronze/30 rounded-xl p-4">
                            <svg className="w-5 h-5 text-bronze flex-shrink-0 mt-0.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M13 16h-1v-4h-1m1-4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z" /></svg>
                            <div className="flex-1">
                                <p className="text-sm text-white/80 font-semibold mb-0.5">{isEs ? 'Completa tu perfil' : 'Complete your profile'}</p>
                                <p className="text-xs text-white/40">{isEs ? 'Agrega tu documento y teléfono para generar cotizaciones completas.' : 'Add your ID and phone to generate complete quotes.'}</p>
                            </div>
                            <button onClick={() => setIsEditMode(true)} className="flex-shrink-0 text-[10px] bg-bronze text-graphite font-bold uppercase tracking-widest px-3 py-1.5 rounded-lg cursor-pointer hover:bg-white transition-colors">
                                {isEs ? 'Completar' : 'Complete'}
                            </button>
                        </div>
                    )}

                    {/* Hero */}
                    <div className="glass-panel rounded-2xl p-6 flex flex-col items-center gap-4 relative text-center">
                        <Avatar size="lg" />
                        <div>
                            <h2 className="text-2xl font-heading font-bold text-white uppercase tracking-tight leading-tight">{userName}</h2>
                            <span className="inline-block mt-1.5 bg-bronze/20 border border-bronze/40 text-bronze text-[10px] font-bold uppercase tracking-widest px-3 py-1 rounded-full">{userRole}</span>
                        </div>
                        <div className="flex flex-col items-center gap-1 text-xs text-white/40">
                            <span>{session?.user?.email}</span>
                            {idNumber && <span className="text-white/25">{idType} · {idNumber}</span>}
                        </div>
                        <button onClick={() => setIsEditMode(true)}
                            className="mt-1 flex items-center gap-2 bg-white/5 hover:bg-bronze hover:text-graphite border border-white/10 hover:border-bronze text-white/60 hover:text-graphite font-bold text-xs uppercase tracking-widest px-5 py-2.5 rounded-xl transition-all cursor-pointer">
                            <svg className="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M11 5H6a2 2 0 00-2 2v11a2 2 0 002 2h11a2 2 0 002-2v-5m-1.414-9.414a2 2 0 112.828 2.828L11.828 15H9v-2.828l8.586-8.586z" /></svg>
                            {isEs ? 'Editar perfil' : 'Edit profile'}
                        </button>
                    </div>

                    {/* Preferencias de cotización */}
                    <div className="glass-panel rounded-2xl p-6 flex flex-col gap-5">
                        <p className="text-xs font-bold text-white/50 uppercase tracking-widest border-b border-white/10 pb-3">{t.mastConf}</p>
                        <div className="flex flex-col gap-4">
                            <div>
                                <FieldLabel>{t.profRole}</FieldLabel>
                                <select value={settings.role} onChange={async (e) => {
                                    const v = e.target.value; updateSettings({ role: v });
                                    if (supabase && session) { try { await supabase.auth.updateUser({ data: { role: v } }); } catch(e){} }
                                }} className="w-full bg-white/5 border border-white/10 rounded-xl px-4 py-3 text-white text-sm focus:outline-none focus:border-bronze transition-all cursor-pointer">
                                    <option value="Propietario">Propietario / Cliente Final</option>
                                    <option value="Arquitecto">Arquitecto</option>
                                    <option value="Desarrollador Inmobiliario">Desarrollador Inmobiliario</option>
                                    <option value="Constructor">Constructor</option>
                                    <option value="Instalador">Instalador</option>
                                    <option value="Otro">Otro</option>
                                </select>
                            </div>
                            <div className="grid grid-cols-2 gap-3">
                                <div>
                                    <FieldLabel>{t.prefCurr}</FieldLabel>
                                    <select value={settings.currency} onChange={e => updateSettings({ currency: e.target.value })} className="w-full bg-white/5 border border-white/10 rounded-xl px-3 py-3 text-white text-sm focus:outline-none focus:border-bronze transition-all cursor-pointer">
                                        <option value="COP">COP</option>
                                        <option value="USD">USD</option>
                                        <option value="EUR">EUR</option>
                                    </select>
                                </div>
                                <div>
                                    <FieldLabel>{t.defMeas}</FieldLabel>
                                    <select value={settings.unit} onChange={e => updateSettings({ unit: e.target.value })} className="w-full bg-white/5 border border-white/10 rounded-xl px-3 py-3 text-white text-sm focus:outline-none focus:border-bronze transition-all cursor-pointer">
                                        <option value="m2">m²</option>
                                        <option value="ft2">ft²</option>
                                    </select>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            );
        }

        /* Mapa para que el cliente marque dónde queda su obra. De ahí sale la distancia
           a la planta y, con ella, la zona y lo que cobra el instalador.
           Tres formas de fijarla, de más a menos precisa: tocar el mapa, usar el GPS
           del dispositivo (solo centra y suelta el pin, el cliente puede corregirlo),
           o elegir la zona a mano si el mapa no carga. Nunca se bloquea la cotización. */
        function UbicacionObra({ language, zone, km, source, coords, onPick, onManual, onReset }) {
            const t = T[language] || T['es'];
            const [manualOpen, setManualOpen] = useState(false);
            const [geoStatus, setGeoStatus] = useState('idle'); // idle | asking | denied | error | unsupported
            const [mapaRoto, setMapaRoto] = useState(false);
            // Búsqueda por dirección / barrio / código postal
            const [query, setQuery] = useState('');
            const [buscando, setBuscando] = useState(false);
            const [resultados, setResultados] = useState(null);
            const [errorBusqueda, setErrorBusqueda] = useState(null); // 'vacio' | 'fallo' | null
            const ultimaBusqueda = useRef(0);
            const divRef = useRef(null);
            const mapRef = useRef(null);
            const markerRef = useRef(null);
            const onPickRef = useRef(onPick);
            onPickRef.current = onPick;

            const zonaNombre = { metro: t.zoneMetro, afueras: t.zoneAfueras, lejana: t.zoneLejana };

            const pinObra = () => window.L.divIcon({
                className: '',
                html: '<div style="width:26px;height:26px;border-radius:50% 50% 50% 0;transform:rotate(-45deg);background:#C18A68;border:2px solid #fff;box-shadow:0 2px 8px rgba(0,0,0,.6)"></div>',
                iconSize: [26, 26], iconAnchor: [13, 26]
            });

            // Monta el mapa una sola vez.
            useEffect(() => {
                if (!window.L) { setMapaRoto(true); return; }
                if (!divRef.current || mapRef.current) return;
                const L = window.L;
                try {
                    const map = L.map(divRef.current, { scrollWheelZoom: false, attributionControl: true })
                                 .setView([KASTON_ORIGEN.lat, KASTON_ORIGEN.lng], 9);

                    L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png', {
                        attribution: '&copy; OpenStreetMap &copy; CARTO',
                        subdomains: 'abcd', maxZoom: 19
                    }).addTo(map);

                    // Anillos: hasta 25 km es área metropolitana; hasta 60 km, afueras.
                    L.circle([KASTON_ORIGEN.lat, KASTON_ORIGEN.lng], {
                        radius: RADIO_AFUERAS_KM * 1000, color: '#C18A68', weight: 1,
                        dashArray: '6 6', fillColor: '#C18A68', fillOpacity: 0.04, interactive: false
                    }).addTo(map);
                    L.circle([KASTON_ORIGEN.lat, KASTON_ORIGEN.lng], {
                        radius: ZONAS_TODO_COSTO[0].maxKm * 1000, color: '#C18A68', weight: 1.5,
                        fillColor: '#C18A68', fillOpacity: 0.16, interactive: false
                    }).addTo(map);

                    L.marker([KASTON_ORIGEN.lat, KASTON_ORIGEN.lng], {
                        icon: L.divIcon({
                            className: '',
                            html: '<div style="width:22px;height:22px;border-radius:4px;background:#0D0D0D;border:2px solid #C18A68;color:#C18A68;font:700 11px/18px Arial;text-align:center">K</div>',
                            iconSize: [22, 22], iconAnchor: [11, 11]
                        })
                    }).addTo(map).bindTooltip(t.geoPlant);

                    map.on('click', e => onPickRef.current(e.latlng.lat, e.latlng.lng, 'mapa'));
                    mapRef.current = map;
                    setTimeout(() => map.invalidateSize(), 120);
                } catch (err) {
                    console.error('No se pudo montar el mapa:', err);
                    setMapaRoto(true);
                }
                return () => {
                    if (mapRef.current) { mapRef.current.remove(); mapRef.current = null; markerRef.current = null; }
                };
            }, []);

            // Mantiene el pin sincronizado con las coordenadas elegidas.
            useEffect(() => {
                const map = mapRef.current;
                if (!map || !window.L) return;
                if (!coords) {
                    if (markerRef.current) { map.removeLayer(markerRef.current); markerRef.current = null; }
                    return;
                }
                if (!markerRef.current) {
                    markerRef.current = window.L.marker([coords.lat, coords.lng], { draggable: true, icon: pinObra() }).addTo(map);
                    markerRef.current.on('dragend', ev => {
                        const pos = ev.target.getLatLng();
                        onPickRef.current(pos.lat, pos.lng, 'mapa');
                    });
                } else {
                    markerRef.current.setLatLng([coords.lat, coords.lng]);
                }
            }, [coords]);

            /* Geocodificación con Nominatim (OpenStreetMap): sin API key y gratis.
               Su política pide máximo 1 consulta por segundo y nada de autocompletar
               tecla por tecla, por eso es un botón de buscar y no una búsqueda en vivo. */
            const buscarDireccion = async () => {
                const q = query.trim();
                if (q.length < 3 || buscando) return;
                const ahora = Date.now();
                if (ahora - ultimaBusqueda.current < 1100) return; // no pasarse del límite de Nominatim
                ultimaBusqueda.current = ahora;

                setBuscando(true);
                setErrorBusqueda(null);
                setResultados(null);
                try {
                    const url = 'https://nominatim.openstreetmap.org/search'
                        + '?format=jsonv2&countrycodes=co&limit=6&addressdetails=1&q=' + encodeURIComponent(q);
                    const res = await fetch(url, { headers: { 'Accept-Language': language === 'en' ? 'en' : 'es' } });
                    if (!res.ok) throw new Error('HTTP ' + res.status);
                    const data = await res.json();
                    if (!Array.isArray(data) || data.length === 0) {
                        setErrorBusqueda('vacio');
                    } else if (data.length === 1) {
                        fijarDesdeResultado(data[0]);
                    } else {
                        setResultados(data);
                    }
                } catch (err) {
                    console.error('No se pudo buscar la dirección:', err);
                    setErrorBusqueda('fallo');
                } finally {
                    setBuscando(false);
                }
            };

            const fijarDesdeResultado = (r) => {
                const lat = parseFloat(r.lat), lng = parseFloat(r.lon);
                if (isNaN(lat) || isNaN(lng)) { setErrorBusqueda('fallo'); return; }
                setResultados(null);
                setErrorBusqueda(null);
                setQuery(r.display_name || query);
                onPickRef.current(lat, lng, 'direccion');
                if (mapRef.current) mapRef.current.setView([lat, lng], 14);
            };

            const usarGPS = () => {
                if (!navigator.geolocation) { setGeoStatus('unsupported'); return; }
                setGeoStatus('asking');
                navigator.geolocation.getCurrentPosition(
                    pos => {
                        const { latitude: lat, longitude: lng } = pos.coords;
                        setGeoStatus('idle');
                        onPickRef.current(lat, lng, 'gps');
                        if (mapRef.current) mapRef.current.setView([lat, lng], 13);
                    },
                    err => setGeoStatus(err && err.code === 1 ? 'denied' : 'error'),
                    { enableHighAccuracy: true, timeout: 12000, maximumAge: 300000 }
                );
            };

            const esLejana = Boolean(zone) && !zone.precioM2;

            return (
                <div className={`glass-panel rounded-2xl p-6 flex flex-col gap-4 mt-2 border ${zone ? (esLejana ? 'border-white/15 bg-white/5' : 'border-bronze/30 bg-bronze/5') : 'border-2 border-bronze/40 bg-bronze/5'}`}>
                    <div className="flex items-center justify-between gap-3 border-b border-bronze/20 pb-3">
                        <div className="text-[10px] text-bronze uppercase tracking-[0.15em] font-bold">{t.geoTitle}</div>
                        {zone && (
                            <button onClick={() => { onReset(); setManualOpen(false); }} className="text-[10px] text-white/40 hover:text-bronze uppercase tracking-widest transition-colors cursor-pointer">{t.geoChange}</button>
                        )}
                    </div>

                    <p className="text-xs text-white/70 leading-relaxed">{mapaRoto ? t.geoWhyNoMap : t.geoWhy}</p>

                    {/* Buscar por dirección, barrio o código postal */}
                    {!mapaRoto && (
                        <div className="flex flex-col gap-2">
                            <label className="text-[10px] text-white/40 uppercase tracking-widest">{t.geoSearchLabel}</label>
                            <div className="flex flex-col sm:flex-row gap-2">
                                <input
                                    type="text"
                                    value={query}
                                    onChange={(e) => { setQuery(e.target.value); setErrorBusqueda(null); }}
                                    onKeyDown={(e) => { if (e.key === 'Enter') { e.preventDefault(); buscarDireccion(); } }}
                                    placeholder={t.geoSearchPlaceholder}
                                    className="flex-1 min-w-0 bg-black/40 border border-white/15 focus:border-bronze focus:outline-none rounded-xl px-4 py-3 text-sm text-white placeholder-white/25 transition-colors"
                                />
                                <button onClick={buscarDireccion} disabled={buscando || query.trim().length < 3}
                                    className={`flex-shrink-0 px-6 py-3 rounded-xl font-bold uppercase tracking-widest text-xs flex items-center justify-center gap-2 transition-all ${buscando || query.trim().length < 3 ? 'opacity-40 cursor-not-allowed bg-white/5 border border-white/10 text-white/40' : 'bg-bronze border border-bronze text-graphite hover:bg-white cursor-pointer'}`}>
                                    <svg className="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"/></svg>
                                    {buscando ? t.geoSearching : t.geoSearchBtn}
                                </button>
                            </div>

                            {errorBusqueda === 'vacio' && <p className="text-xs text-amber-400/90 leading-relaxed">{t.geoSearchEmpty}</p>}
                            {errorBusqueda === 'fallo' && <p className="text-xs text-amber-400/90 leading-relaxed">{t.geoSearchFail}</p>}

                            {resultados && resultados.length > 0 && (
                                <div className="flex flex-col gap-1.5 border border-white/10 rounded-xl p-2 bg-black/30">
                                    <div className="text-[10px] text-white/40 uppercase tracking-widest px-2 pt-1">{t.geoSearchResults}</div>
                                    {resultados.map((r, i) => (
                                        <button key={r.place_id || i} onClick={() => fijarDesdeResultado(r)}
                                            className="w-full text-left px-3 py-2.5 rounded-lg border border-transparent hover:border-bronze/50 hover:bg-bronze/10 transition-all cursor-pointer">
                                            <span className="text-xs text-white/80 leading-snug block">{r.display_name}</span>
                                        </button>
                                    ))}
                                </div>
                            )}

                            <p className="text-[10px] text-white/30">{t.geoSearchHint}</p>
                        </div>
                    )}

                    {!mapaRoto && (
                        <>
                            <div ref={divRef}
                                 className="w-full rounded-xl overflow-hidden border border-white/10"
                                 style={{ height: '320px', background: '#0D0D0D', zIndex: 0 }} />
                            <div className="flex flex-wrap items-center gap-x-4 gap-y-1 text-[10px] text-white/40 uppercase tracking-widest">
                                <span className="flex items-center gap-1.5"><span style={{ width: 10, height: 10, borderRadius: 2, background: 'rgba(193,138,104,.45)', border: '1px solid #C18A68', display: 'inline-block' }}></span>{t.zoneMetro}</span>
                                <span className="flex items-center gap-1.5"><span style={{ width: 10, height: 10, borderRadius: 2, background: 'rgba(193,138,104,.12)', border: '1px dashed #C18A68', display: 'inline-block' }}></span>{t.zoneAfueras}</span>
                            </div>
                        </>
                    )}

                    {geoStatus === 'denied' && <p className="text-xs text-amber-400/90 leading-relaxed">{t.geoDenied}</p>}
                    {geoStatus === 'error' && <p className="text-xs text-amber-400/90 leading-relaxed">{t.geoError}</p>}
                    {geoStatus === 'unsupported' && <p className="text-xs text-amber-400/90 leading-relaxed">{t.geoUnsupported}</p>}

                    {!mapaRoto && (
                        <button onClick={usarGPS} disabled={geoStatus === 'asking'}
                            className={`w-full justify-center transition-all duration-300 border px-6 py-3.5 rounded-xl font-bold uppercase tracking-widest text-xs flex items-center gap-3 ${geoStatus === 'asking' ? 'opacity-50 cursor-wait bg-black text-white/40 border-white/10' : 'bg-white/5 border-bronze/40 text-bronze hover:bg-bronze hover:text-graphite cursor-pointer'}`}>
                            <svg className="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M17.657 16.657L13.414 20.9a2 2 0 01-2.827 0l-4.244-4.243a8 8 0 1111.314 0z"/><path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M15 11a3 3 0 11-6 0 3 3 0 016 0z"/></svg>
                            {geoStatus === 'asking' ? t.geoAsking : t.geoUseLocation}
                        </button>
                    )}

                    {/* Resultado */}
                    {zone && (
                        <div className={`rounded-xl p-4 flex flex-col gap-1.5 border ${esLejana ? 'border-white/15 bg-white/5' : 'border-bronze/30 bg-bronze/10'}`}>
                            <div className="text-sm text-white font-bold">{zonaNombre[zone.id]}</div>
                            {km !== null && km !== undefined && (
                                <div className="text-[11px] text-white/45">{t.geoDistance} {km} km {t.geoFromPlant}</div>
                            )}
                            {source === 'manual' && <div className="text-[11px] text-white/45">{t.geoManualUsed}</div>}
                            {source === 'direccion' && <div className="text-[11px] text-white/45">{t.geoAddressUsed}</div>}
                            <p className="text-xs text-white/60 leading-relaxed mt-1">{esLejana ? t.geoLejanaNote : t.geoZoneNote}</p>
                        </div>
                    )}

                    {/* Respaldo manual: siempre disponible */}
                    {!manualOpen ? (
                        <button onClick={() => setManualOpen(true)} className="text-[11px] text-white/40 hover:text-bronze uppercase tracking-widest transition-colors cursor-pointer text-center">
                            {t.geoManualLink}
                        </button>
                    ) : (
                        <div className="flex flex-col gap-2 border-t border-white/10 pt-4">
                            <div className="text-[10px] text-white/40 uppercase tracking-widest mb-1">{t.geoManualTitle}</div>
                            {ZONAS_TODO_COSTO.map(z => (
                                <button key={z.id} onClick={() => { onManual(z.id); setManualOpen(false); }}
                                    className={`w-full text-left px-4 py-3 rounded-xl border transition-all cursor-pointer ${zone && zone.id === z.id && source === 'manual' ? 'border-bronze bg-bronze/15' : 'border-white/10 bg-white/5 hover:border-bronze/50 hover:bg-bronze/10'}`}>
                                    <div className="text-xs text-white font-bold">{zonaNombre[z.id]}</div>
                                    <div className="text-[10px] text-white/40 mt-0.5">{t['zoneHint_' + z.id]}</div>
                                </button>
                            ))}
                        </div>
                    )}

                    <p className="text-[10px] text-white/30 leading-relaxed">{t.geoPrivacy}</p>
                </div>
            );
        }

        function CalculatorTab({ defaults, onSaveProject, editingProject, defaultFlow, session, setCurrentTab, setTriageFlow, rates, language }) {
            const t = T[language] || T['es'];
            // defaultFlow ahora transporta la MODALIDAD elegida en la pantalla de inicio: 'supply' (solo tejas) o 'full' (todo costo)
            const [flowActive, setFlowActive] = useState('B');
            const [constructionType, setConstructionType] = useState(editingProject ? (editingProject.tipoConstruccion || 'Residencial') : 'Residencial');
            const [inputValue, setInputValue] = useState(defaults.area || 150);
            const [inputText, setInputText] = useState(String(defaults.area || 150));
            const [unit, setUnit] = useState(defaults.unit);
            const [currency, setCurrency] = useState(defaults.currency);
            const [material, setMaterial] = useState('clay');
            const [modality, setModality] = useState(editingProject ? editingProject.modality : ((defaultFlow === 'supply' || defaultFlow === 'full') ? defaultFlow : null));
            const [isSaving, setIsSaving] = useState(false);
            const [isPdfDownloaded, setIsPdfDownloaded] = useState(false);
            const [showZincModal, setShowZincModal] = useState(false);
            const [roofType, setRoofType] = useState(editingProject ? (editingProject.roofType || null) : null);
            const [pendiente, setPendiente] = useState(editingProject ? (editingProject.pendiente !== undefined ? editingProject.pendiente : null) : undefined);
            const [selectedColor, setSelectedColor] = useState(editingProject ? (editingProject.selectedColor || null) : null);

            /* Ubicación de la obra: solo se usa en la modalidad "todo costo",
               porque ahí el precio cambia según lo que cobre el instalador por la distancia. */
            const [obraCoords, setObraCoords] = useState(editingProject ? (editingProject.obraCoords || null) : null);
            const [geoKm, setGeoKm] = useState(editingProject ? (editingProject.geoKm ?? null) : null);
            const [zoneId, setZoneId] = useState(editingProject ? (editingProject.zoneId || null) : null);
            const [zoneSource, setZoneSource] = useState(editingProject ? (editingProject.zoneSource || null) : null); // 'mapa' | 'gps' | 'manual'

            const zone = modality === 'full' ? zonaPorId(zoneId) : null;

            // El cliente marcó un punto (tocando el mapa, arrastrando el pin o vía GPS).
            const fijarUbicacion = (lat, lng, src) => {
                const km = distanciaDesdePlanta(lat, lng);
                setObraCoords({ lat, lng });
                setGeoKm(Number(km.toFixed(1)));
                setZoneId(zonaPorPunto(lat, lng).id);
                setZoneSource(src || 'mapa');
            };

            // Respaldo: eligió la zona a mano, sin punto en el mapa.
            const elegirZonaManual = (id) => {
                setZoneId(id);
                setZoneSource('manual');
                setObraCoords(null);
                setGeoKm(null);
            };

            const resetZona = () => {
                setZoneId(null);
                setZoneSource(null);
                setObraCoords(null);
                setGeoKm(null);
            };

            useEffect(() => {
                setUnit(defaults.unit);
                setCurrency(defaults.currency);
            }, [defaults]);

            const handleUnitChange = (e) => {
                const newUnit = e.target.value;
                if (newUnit === unit) return;

                let newVal;
                if (newUnit === 'ft2') {
                    newVal = Number((inputValue * 10.7639).toFixed(2));
                } else {
                    newVal = Number((inputValue / 10.7639).toFixed(2));
                }
                setInputValue(newVal);
                setInputText(String(newVal));
                setUnit(newUnit);
            };

            const areaM2 = unit === 'ft2' ? inputValue / 10.7639 : inputValue;
            const metrics = useMemo(() => calculateMetrics(areaM2, material, currency, rates, zone), [areaM2, material, currency, rates, zone]);

            const sliderMin = unit === 'ft2' ? 10.76 : 1;
            const sliderMax = unit === 'ft2' ? 16145.85 : 1500;
            const sliderStep = unit === 'ft2' ? 0.01 : 1;

            const activeRoofObj = ROOF_TYPES.find(r => r.id === roofType);
            const isSpecialDesign = activeRoofObj?.id === 'otro';

            // En "todo costo" no hay precio hasta saber la zona, y las zonas de más de
            // 60 km no tienen tarifa automática: esas las cotiza un asesor.
            const zonaLista = modality !== 'full' || Boolean(zone && zone.precioM2);
            const zonaFueraDeCobertura = modality === 'full' && Boolean(zone) && !zone.precioM2;

            // Nuevo flujo: modalidad (de inicio) + tipo de construcción + tipo de techo + pendiente válida + área + zona
            const isFormComplete = Boolean(
                modality && areaM2 > 0 && constructionType && roofType && zonaLista &&
                (isSpecialDesign || (pendiente !== undefined && (pendiente === null || (typeof pendiente === 'number' && pendiente >= 15))))
            );

            const handlePDF = async (options = {}) => {
                if (!isSpecialDesign && !modality) return;
                // Sin zona resuelta no hay precio de todo costo que imprimir.
                if (!isSpecialDesign && modality === 'full' && !(zone && zone.precioM2)) return;
                const withObservation = options && options.withObservation === true;
                setIsSaving(true);
                try {
                    const doc = new jsPDF();
                    const logoDataUrl = await loadLogoForPDF();
                    const activeRoofObjForSvg = ROOF_TYPES.find(r => r.id === roofType);
                    const roofPngUrl = activeRoofObjForSvg?.imagePath ? await loadImageAsBase64(activeRoofObjForSvg.imagePath) : null;
                    const colorObj = KASTON_COLORS.find(c => c.id === selectedColor);
                    const selectedColorHex = colorObj ? colorObj.hex : null;

                    const meta = session?.user?.user_metadata || {};
                    const clientName = meta.full_name || session?.user?.email?.split('@')[0] || t.pdfClientUnreg;
                    buildPremiumPDF(doc, {
                        t, flow: flowActive, area: inputValue, unit, areaM2,
                        material, currency, metrics, modality,
                        zone, geoKm,
                        roofType, pendiente, selectedColor,
                        constructionType, isSpecialDesign, roofPngUrl, selectedColorHex,
                        clientName,
                        clientPhone: meta.phone       || t.pdfClientUnreg,
                        clientDoc:   meta.id_number ? `${meta.id_type||''} ${meta.id_number}`.trim() : t.pdfClientUnreg,
                        clientRole:  meta.role        || t.pdfClientUnreg,
                        withObservation, includeZincWaiver: false,
                    }, logoDataUrl);
                    doc.save(`Cotización Kaston - ${clientName}.pdf`);
                    setIsPdfDownloaded(true);
                } catch (err) {
                    console.error("Error durante el proceso:", err);
                } finally {
                    setIsSaving(false);
                }
            };

            const promptAndSaveProject = (hasOwnStructure = false) => {
                const defaultName = editingProject ? editingProject.nombre : "Proyecto Kaston";
                const nombre = prompt(t.pdfProjName, defaultName);
                if (!nombre || !nombre.trim()) {
                    alert(t.pdfCancelName);
                    return;
                }

                onSaveProject({
                    id: editingProject ? editingProject.id : crypto.randomUUID(),
                    nombre: nombre.trim(),
                    flow: flowActive,
                    tipoConstruccion: constructionType,
                    material: material,
                    roofType: roofType,
                    pendiente: pendiente,
                    selectedColor: selectedColor,
                    area: inputValue,
                    unidad: unit,
                    inversion_tejas: modality === 'full' ? metrics.finalCostTodoCosto : metrics.finalCost,
                    modality: modality,
                    zoneId: zoneId,
                    zoneSource: zoneSource,
                    geoKm: geoKm,
                    obraCoords: obraCoords,
                    divisa: currency,
                    plastico_kg: metrics.plasticUpcycled,
                    co2_kg: metrics.co2Reduced,
                    fecha: editingProject ? editingProject.fecha : new Date().toISOString().split('T')[0],
                    hasOwnStructure
                });

                alert(modality === 'full' ? t.transportNoticeAlertFull : t.transportNoticeAlert);
            };

            const handleZincYes = () => {
                setShowZincModal(false);
                const ASESORIA_SUBJECT = encodeURIComponent('Solicitud de Asesoría Técnica Estructural - Proyecto KASTON');
                const ASESORIA_BODY = encodeURIComponent(
                    `${t.mailStr1}\n` +
                    `${t.mailStr2}\n` +
                    `${t.mailStr3}\n` +
                    `${t.mailStr4}\n` +
                    `${t.mailStr5}\n` +
                    `${t.mailStr6}\n\n` +
                    `${t.mailStr7}\n\n` +
                    `${t.mailStr8}`
                );
                window.location.href = `mailto:KASTON.PROYECTOS@GMAIL.COM?subject=${ASESORIA_SUBJECT}&body=${ASESORIA_BODY}`;
            };

            const handleZincNo = () => {
                setShowZincModal(false);
                handlePDF({ withObservation: true }).then(() => {
                    promptAndSaveProject(true);
                });
            };

            const handleSave = () => {
                if (!isPdfDownloaded) {
                    alert(t.saveProjAlert);
                    return;
                }

                if (!session) {
                    alert(t.loginToSave);
                    setCurrentTab('profile');
                    return;
                }

                promptAndSaveProject(false);
            };

            return (
                <div className="w-full max-w-5xl flex flex-col gap-8 w-full animate-fade-in">
                    {showZincModal && (
                        <div className="fixed inset-0 z-[100] flex items-center justify-center bg-black/80 backdrop-blur-sm p-4">
                            <div className="glass-panel p-8 rounded-2xl max-w-md w-full text-center border border-bronze shadow-[0_0_30px_rgba(193,138,104,0.3)] animate-fade-in">
                                <div className="w-16 h-16 rounded-full bg-bronze/20 text-bronze flex items-center justify-center mx-auto mb-6">
                                    <svg className="w-8 h-8" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M13 16h-1v-4h-1m1-4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z" /></svg>
                                </div>
                                <h3 className="text-base font-bold text-white mb-4">
                                    {t.zincAlertBody1} <strong>{areaM2.toLocaleString('en-US', { maximumFractionDigits: 1 })} m²</strong> {t.zincAlertBody2} <strong>{(areaM2 * KASTON_UNITS_PER_M2).toLocaleString('en-US', { maximumFractionDigits: 0 })} {t.zincAlertBody3}</strong> (a 300g por unidad y {KASTON_UNITS_PER_M2} tejas por m²), {t.zincAlertBody4} <strong>{(areaM2 * 12.6).toLocaleString('en-US', { maximumFractionDigits: 1 })} kg</strong> {t.zincAlertBody5}
                                </h3>
                                <div className="flex gap-4 mt-8 flex-col sm:flex-row">
                                    <button onClick={handleZincYes} className="flex-1 py-3 px-4 bg-bronze hover:bg-white text-graphite font-bold rounded-xl uppercase tracking-widest transition-colors cursor-pointer text-xs">
                                        {t.adviseBtn}
                                    </button>
                                    <button onClick={handleZincNo} className="flex-1 py-3 px-4 bg-white/5 hover:bg-white/10 border border-white/20 text-white rounded-xl uppercase tracking-widest transition-colors font-bold cursor-pointer text-xs">
                                        {t.assumeStrBtn}
                                    </button>
                                </div>
                            </div>
                        </div>
                    )}
                    <div className="glass-panel rounded-2xl p-8 flex flex-col gap-7 relative overflow-hidden">
                        <div className="absolute top-[-50px] right-[-50px] w-64 h-64 bg-bronze rounded-full opacity-10 blur-[100px] pointer-events-none"></div>
                        <div className="absolute bottom-[-50px] left-[-50px] w-64 h-64 bg-bronze rounded-full opacity-10 blur-[100px] pointer-events-none"></div>

                        {/* Título */}
                        <h2 className="text-lg font-heading font-bold tracking-widest text-white uppercase relative z-10">
                            {t.typeAreaProj}
                        </h2>

                        {/* Modalidad elegida */}
                        <div className="relative z-10 flex items-center justify-between gap-4 p-4 rounded-xl bg-bronze/10 border border-bronze/30">
                            <div>
                                <div className="text-[10px] text-white/50 uppercase tracking-[0.15em] font-bold mb-1">{t.chosenModality}</div>
                                <div className="text-bronze text-sm font-bold uppercase tracking-widest">{modality === 'full' ? t.allInc : t.onlyTile}</div>
                            </div>
                            <button onClick={() => { setTriageFlow(null); setCurrentTab('triage'); }} className="text-[10px] text-white/40 hover:text-bronze uppercase tracking-widest underline transition-colors cursor-pointer">{t.changeModality}</button>
                        </div>

                        {/* Tipo de construcción (opcional) */}
                        <div className="relative z-10">
                            <label className="block text-[10px] text-white/50 uppercase tracking-[0.15em] mb-2 font-bold">{t.constType}</label>
                            <select value={constructionType} onChange={(e) => setConstructionType(e.target.value)}
                                className="w-full bg-black/50 border border-white/10 rounded-xl px-4 py-3 text-white text-sm font-medium focus:outline-none focus:border-bronze transition-all appearance-none cursor-pointer hover:border-white/25">
                                {[{ val: 'Residencial', label: t.constRes }, { val: 'Comercial', label: t.constCom }, { val: 'Industrial', label: t.constInd }, { val: 'Institucional', label: t.constInst }, { val: 'Agropecuario', label: t.constAgro }, { val: 'Otros', label: t.constOth }].map(tipo => (
                                    <option key={tipo.val} value={tipo.val}>{tipo.label}</option>
                                ))}
                            </select>
                        </div>

                        {/* Área del proyecto */}
                        <div className="relative z-10">
                            <label className="block text-[10px] text-white/50 uppercase tracking-[0.15em] mb-4 font-bold">{language === 'en' ? 'Project area' : 'Área del proyecto'}</label>
                            <div className="flex items-end gap-4 mb-6">
                                <input
                                    type="number"
                                    min={sliderMin} max={unit === 'ft2' ? 16145.85 : 1500}
                                    step={sliderStep}
                                    value={inputText}
                                    onChange={(e) => {
                                        const raw = e.target.value;
                                        setInputText(raw);
                                        const parsed = parseFloat(raw);
                                        if (!isNaN(parsed) && parsed > 0) {
                                            if (parsed > (unit === 'ft2' ? 16145 : 1500)) {
                                                alert(T[language]?.redirectRouteC || "Área límite superada. Bloqueo de seguridad activado, será redireccionado al Plan de Ingeniería Integral.");
                                                setFlowActive('C');
                                                const maxVal = unit === 'ft2' ? 16145 : 1500;
                                                setInputValue(maxVal);
                                                setInputText(String(maxVal));
                                            } else {
                                                setInputValue(parsed);
                                            }
                                        }
                                    }}
                                    onBlur={() => {
                                        const maxVal = unit === 'ft2' ? 16145 : 1500;
                                        const clamped = Math.max(sliderMin, Math.min(parseFloat(inputText) || sliderMin, maxVal));
                                        setInputValue(clamped);
                                        setInputText(String(clamped));
                                    }}
                                    className="bg-transparent text-7xl w-44 outline-none border-b-2 border-bronze/40 focus:border-bronze text-bronze text-center font-black transition-colors drop-shadow-[0_0_20px_rgba(193,138,104,0.35)] [appearance:textfield] [&::-webkit-outer-spin-button]:appearance-none [&::-webkit-inner-spin-button]:appearance-none"
                                />
                                <select value={unit} onChange={handleUnitChange}
                                    className="bg-transparent text-3xl font-light text-white/40 mb-2 outline-none cursor-pointer hover:text-white/70 transition-colors appearance-none">
                                    <option value="m2" className="bg-graphite text-base">m²</option>
                                    <option value="ft2" className="bg-graphite text-base">ft²</option>
                                </select>
                            </div>
                            <input
                                type="range" min={sliderMin} max={sliderMax} step={sliderStep} value={inputValue}
                                onChange={(e) => {
                                    const val = parseInt(e.target.value, 10);
                                    if (val > (unit === 'ft2' ? 16145 : 1500)) {
                                        alert(T[language]?.redirectRouteC || "Área límite superada. Bloqueo de seguridad activado, será redireccionado al Plan de Ingeniería Integral.");
                                        setFlowActive('C');
                                        const maxVal = unit === 'ft2' ? 16145 : 1500;
                                        setInputValue(maxVal);
                                        setInputText(String(maxVal));
                                    } else {
                                        setInputValue(val);
                                        setInputText(String(val));
                                    }
                                }} className="w-full cursor-pointer h-8"
                            />
                            <div className="flex justify-between text-xs text-white/25 uppercase mt-2 tracking-widest">
                                <span>{sliderMin} {unit}</span>
                                <span>{sliderMax} {unit}</span>
                            </div>
                        </div>
                    </div>

                    {/* Configurador de techo (tipo + pendiente) */}
                    <RoofConfigurator
                        selectedType={roofType}
                        onSelectType={setRoofType}
                        pendiente={pendiente}
                        onPendienteChange={setPendiente}
                        language={language}
                    />

                    {isSpecialDesign ? (
                        <div className="glass-panel rounded-2xl p-8 flex flex-col items-center justify-center border border-bronze/30 bg-bronze/5 text-center mt-2 animate-fade-in">
                            <div className="w-12 h-12 rounded-full bg-bronze/20 text-bronze flex items-center justify-center text-xl font-black mb-4">&#9733;</div>
                            <h3 className="text-xl font-heading font-bold text-white uppercase tracking-wider mb-3">{t.specialTitle}</h3>
                            <p className="text-white/80 text-sm leading-relaxed max-w-2xl mx-auto">{t.specialBody}</p>
                        </div>
                    ) : (
                    <>
                    {/* Requisitos de obra (todo costo) o nota de manual (solo tejas) */}
                    {modality === 'full' ? (
                        <div className="glass-panel rounded-2xl p-6 border border-bronze/30 bg-bronze/5 flex flex-col gap-3 mt-2">
                            <div className="text-[10px] text-bronze uppercase tracking-[0.15em] font-bold border-b border-bronze/20 pb-3">{t.reqObraTitle}</div>
                            <ul className="flex flex-col gap-3 text-xs text-white/75 leading-relaxed list-none">
                                <li className="flex items-start gap-3"><span className="text-bronze mt-0.5 flex-shrink-0">&#10003;</span><span>{t.reqObra1}</span></li>
                                <li className="flex items-start gap-3"><span className="text-bronze mt-0.5 flex-shrink-0">&#10003;</span><span>{t.reqObra2}</span></li>
                            </ul>
                        </div>
                    ) : (
                        <div className="glass-panel rounded-2xl p-6 border border-bronze/30 bg-bronze/5 flex items-start gap-3 mt-2">
                            <svg className="w-5 h-5 text-bronze flex-shrink-0 mt-0.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M13 16h-1v-4h-1m1-4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"/></svg>
                            <div className="flex flex-col gap-2">
                                <p className="text-bronze text-xs leading-relaxed">{t.manualNote}</p>
                                <p className="text-white/50 text-xs leading-relaxed">{t.supplyPriceNote}</p>
                            </div>
                        </div>
                    )}

                    {/* Ubicación de la obra: define la zona y, con ella, la tarifa del instalador */}
                    {modality === 'full' && (
                        <UbicacionObra
                            language={language}
                            km={geoKm}
                            zone={zone}
                            source={zoneSource}
                            coords={obraCoords}
                            onPick={fijarUbicacion}
                            onManual={elegirZonaManual}
                            onReset={resetZona}
                        />
                    )}

                    {/* Métricas del proyecto (ambas modalidades) */}
                    <div className="grid grid-cols-1 sm:grid-cols-3 gap-4">
                        <div className="glass-panel p-5 rounded-2xl flex flex-col items-center text-center">
                            <div className="text-3xl font-black text-bronze tabular-nums"><AnimatedNumber value={metrics.units} /></div>
                            <div className="text-[10px] text-white/40 uppercase tracking-widest mt-2">{t.tilesNeeded}</div>
                        </div>
                        <div className="glass-panel p-5 rounded-2xl flex flex-col items-center text-center">
                            <div className="text-3xl font-black text-bronze tabular-nums"><AnimatedNumber value={areaM2 * 12.6} decimals={0} /> <span className="text-base font-light">kg</span></div>
                            <div className="text-[10px] text-white/40 uppercase tracking-widest mt-2">{t.totalWeight}</div>
                        </div>
                        <div className="glass-panel p-5 rounded-2xl flex flex-col items-center text-center">

        function MainDashboard({ onLogout, session, extraData, onAuth }) {
            const [showWelcomeModal, setShowWelcomeModal] = useState(() => !sessionStorage.getItem('kaston_welcomed'));
            const [currentTab, setCurrentTab] = useState(() => sessionStorage.getItem('kaston_currentTab') || 'triage');
            const [projects, setProjects] = useState([]);
            const [language, setLanguage] = useState('es');
            const [triageFlow, setTriageFlow] = useState(() => sessionStorage.getItem('kaston_triageFlow') || null);
            const [rates, setRates] = useState(exchangeRates);

            useEffect(() => {
                fetch('https://open.er-api.com/v6/latest/COP')
                    .then(res => res.json())
                    .then(data => {
                        if (data && data.result === 'success') {
                            setRates({ COP: 1, USD: data.rates.USD, EUR: data.rates.EUR });
                        }
                    })
                    .catch(console.error);
            }, []);

            useEffect(() => {
                sessionStorage.setItem('kaston_currentTab', currentTab);
            }, [currentTab]);

            useEffect(() => {
                if (triageFlow) sessionStorage.setItem('kaston_triageFlow', triageFlow);
                else sessionStorage.removeItem('kaston_triageFlow');
            }, [triageFlow]);
            const userName = extraData?.fullName || session?.user?.user_metadata?.full_name || session?.user?.email?.split('@')[0] || 'Ingeniero';
            const userEmail = session?.user?.email || '';
            const [settings, setSettings] = useState({
                name: userName,
                role: session?.user?.user_metadata?.role || 'Propietario',
                currency: 'COP',
                unit: 'm2'
            });
            const [editingProject, setEditingProject] = useState(null);

            const handleSaveProject = async (proj) => {
                const fullProj = { ...proj };
                const userId = session?.user?.id;

                if (editingProject) {
                    setProjects(projects.map(p => p.id === proj.id ? fullProj : p));
                    if (supabase && userId) {
                        const { error } = await supabase.from('projects')
                            .update({
                                client_name: proj.nombre,
                                project_m2: proj.unidad === 'ft2' ? proj.area / 10.764 : proj.area,
                                plastic_upcycled_kg: proj.plastico_kg,
                                estimated_savings_usd: proj.inversion_tejas,
                                project_data: JSON.stringify(fullProj)
                            })
                            .eq('id', proj.id)
                            .eq('user_id', userId);
                        if (error) console.error('Error actualizando:', error.message);
                    }
                    setEditingProject(null);
                } else {
                    setProjects([fullProj, ...projects]);
                    if (supabase) {
                        // Siempre obtenemos la sesión fresca del cliente para evitar closure stale
                        const { data: authData } = await supabase.auth.getSession();
                        const activeUid = authData?.session?.user?.id || userId;
                        if (!activeUid) {
                            alert('⚠️ No hay sesión activa. Inicia sesión de nuevo.');
                            return;
                        }
                        const payload = {
                            user_id: activeUid,
                            client_name: proj.nombre,
                            project_m2: proj.unidad === 'ft2' ? proj.area / 10.764 : proj.area,
                            plastic_upcycled_kg: proj.plastico_kg,
                            estimated_savings_usd: proj.inversion_tejas,
                            selected_color: proj.divisa,
                            project_data: JSON.stringify(fullProj),
                            created_at: new Date().toISOString()
                        };
                        // Proxy Vercel para evitar bloqueo de Safari en POST cross-origin
                        const token = authData?.session?.access_token;
                        const resp = await fetch('/api/save-project', {
                            method: 'POST',
                            headers: {
                                'Content-Type': 'application/json',
                                'Authorization': `Bearer ${token}`
                            },
                            body: JSON.stringify(payload)
                        });
                        if (!resp.ok) {
                            const txt = await resp.text();
                            alert('⚠️ Error al guardar: ' + txt);
                        }
                    }
                }
                setTimeout(() => { setTriageFlow(null); setCurrentTab('triage'); }, 100);
            };

            const handleEditProject = (proj) => {
                setSettings({ ...settings, unit: proj.unidad, area: proj.area });
                setTriageFlow(proj.flow);
                setEditingProject(proj);
                setCurrentTab('dashboard');
            };

            const handleDeleteProject = async (id) => {
                if (window.confirm(T[language]?.deleteConfirm || T['es'].deleteConfirm)) {
                    if (supabase) {
                        const { error } = await supabase.from('projects').delete().eq('id', id).eq('user_id', session?.user?.id);
                        if (error) {
                            alert(T[language]?.deleteError || 'Error al eliminar el proyecto. Intenta de nuevo.');
                            return;

                    }
                    setProjects(projects.filter(p => p.id !== id));
                }
            };

            const getMailtoLink = (proj) => {
                const targetProj = proj;
                if (!targetProj) return '#';
                const subject = encodeURIComponent(`Cotización - ${targetProj?.tipoConstruccion || 'Proyecto'}`);
                const body = encodeURIComponent(`Nombre de la persona: ${userName}\nCorreo de la persona: ${userEmail}\n\nAdjunto la cotización generada automáticamente por la plataforma KASTON.\n\nPOR FAVOR, ADJUNTE EN ESTE CORREO EL PDF GENERADO DESCARGADO Y LAS IMÁGENES DE REFERENCIA DE LA CONSTRUCCIÓN A COTIZAR.\n\nDetalles del proyecto:\n- Nombre: ${targetProj?.nombre}\n- Tipo de construcción: ${targetProj?.tipoConstruccion}\n- Área: ${targetProj?.area} ${targetProj?.unidad}\n- Inversión estimada: $${targetProj?.inversion_tejas?.toLocaleString()} ${targetProj?.divisa}`);
                return `mailto:kaston.proyectos@gmail.com?subject=${subject}&body=${body}`;
            };

            const handleQuoteProject = (proj) => {
                window.location.href = getMailtoLink(proj);
            };

            const getWhatsAppQuoteLink = (proj) => {
                if (!proj) return '#';
                const text = `Nombre de la persona: ${userName}\nCorreo de la persona: ${userEmail}\n\nAdjunto la cotización generada automáticamente por la plataforma KASTON.\n\nPOR FAVOR ADJUNTE EL PDF GENERADO Y LAS IMÁGENES DE REFERENCIA DE LA CONSTRUCCIÓN A COTIZAR.\n\nDetalles del proyecto:\n- Nombre: ${proj?.nombre}\n- Tipo de construcción: ${proj?.tipoConstruccion}\n- Área: ${proj?.area} ${proj?.unidad}\n- Inversión estimada: $${proj?.inversion_tejas?.toLocaleString()} ${proj?.divisa}`;
                return `https://wa.me/573188978552?text=${encodeURIComponent(text)}`;
            };

            const handleWhatsAppQuoteProject = (proj) => {
                window.open(getWhatsAppQuoteLink(proj), '_blank');
            };

            const handleLanguageChange = (langVal) => {
                setLanguage(langVal);
                localStorage.setItem('kastonLang', langVal);
                document.documentElement.lang = langVal;
            };

            useEffect(() => {
                const savedLang = localStorage.getItem('kastonLang') || 'es';
                setLanguage(savedLang);
                document.documentElement.lang = savedLang;
            }, []);

            // Carga proyectos desde Supabase al iniciar sesión
            useEffect(() => {
                if (session && supabase) {
                    supabase
                        .from('projects')
                        .select('*')
                        .eq('user_id', session.user.id)
                        .order('created_at', { ascending: false })
                        .then(({ data, error }) => {
                            if (error) {
                                console.error('Error cargando proyectos:', error);
                                // Intenta cargar caché local como respaldo
                                try {
                                    const cached = localStorage.getItem('kaston_projects_cache');
                                    if (cached) setProjects(JSON.parse(cached));
                                } catch {}
                                return;
                            }
                            if (data) {
                                const loaded = data.map(p => {
                                    // Preferir project_data (JSON completo)
                                    if (p.project_data) {
                                        try { return JSON.parse(p.project_data); } catch {}
                                    }
                                    // Reconstruir desde columnas individuales
                                    const storedVal = p.selected_color || '';
                                    const isCurrency = ['COP', 'USD', 'EUR'].includes(storedVal);
                                    const fechaFallback = p.created_at
                                        ? new Date(p.created_at).toLocaleDateString('es-CO')
                                        : new Date().toLocaleDateString('es-CO');
                                    return {
                                        id: p.id,
                                        nombre: p.client_name || 'Sin nombre',
                                        area: p.project_m2 || 0,
                                        unidad: 'm2',
                                        inversion_tejas: p.estimated_savings_usd || 0,
                                        plastico_kg: p.plastic_upcycled_kg || 0,
                                        divisa: isCurrency ? storedVal : 'COP',
                                        fecha: fechaFallback,
                                        material: 'clay',
                                        tipoConstruccion: 'Residencial',
                                        flow: 'A',
                                    };
                                });
                                setProjects(loaded);
                                try { localStorage.setItem('kaston_projects_cache', JSON.stringify(loaded)); } catch {}
                            }
                        })
                        .catch(e => console.error('Error de red cargando proyectos:', e));
                } else if (!session) {
                    try {
                        const cached = localStorage.getItem('kaston_projects_cache');
                        if (cached) setProjects(JSON.parse(cached));
                        else setProjects([]);
                    } catch { setProjects([]); }
                }
            }, [session]);

            // Sincronizar proyectos a localStorage cuando cambian (solo si hay sesión activa)
            useEffect(() => {
                if (session && projects.length > 0) {
                    try { localStorage.setItem('kaston_projects_cache', JSON.stringify(projects)); } catch (e) {}
                }
            }, [projects, session]);

            // Prioritize triage upon login
            const prevSession = React.useRef(null);
            React.useEffect(() => {
                if (session && !prevSession.current) {
                    // User just logged in
                    setCurrentTab('triage');
                    setTriageFlow(null);
                }
                prevSession.current = session;
            }, [session]);



            const t = T[language] || T['es'];

            return (
                <div className="min-h-screen bg-graphite font-sans flex flex-col items-center pb-24">
                    {showWelcomeModal && (
                        <WelcomeModal language={language} onAccept={() => {
                            sessionStorage.setItem('kaston_welcomed', '1');
                            setShowWelcomeModal(false);
                        }} />
                    )}
                    <header className="w-full border-b border-white/10 sticky top-0 z-50" style={{ backgroundColor: '#0E0E0E' }}>
