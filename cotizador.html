    <style>
        body {
            background-color: #0D0D0D;
            color: white;
            font-family: 'Inter', sans-serif;
            margin: 0;
            padding: 0;
        }

        .glass-panel {
            background-color: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
        }

        .card,
        .spec-item,
        .info-tooltip,
        .glass-panel {
            word-break: break-word;
            overflow-wrap: break-word;
        }

        /* Custom Range Slider */
        input[type=range] {
            -webkit-appearance: none;
            appearance: none;
            width: 100%;
            background: transparent;
        }

        input[type=range]::-webkit-slider-thumb {
            -webkit-appearance: none;
            height: 24px;
            width: 24px;
            border-radius: 50%;
            background: #C18A68;
            cursor: pointer;
            margin-top: -10px;
            box-shadow: 0 0 10px rgba(193, 138, 104, 0.8);
            transition: transform 0.1s;
        }

        input[type=range]::-webkit-slider-thumb:hover {
            transform: scale(1.1);
        }

        input[type=range]::-webkit-slider-runnable-track {
            width: 100%;
            height: 4px;
            cursor: pointer;
            background: rgba(255, 255, 255, 0.2);
            border-radius: 2px;
        }

        input[type=range]:focus {
            outline: none;
        }

        /* ===== RESPONSIVE MOBILE FIXES ===== */
        html,
        body {
            overflow-x: hidden;
            max-width: 100vw;
        }

        /* Hide number input spinners (cross-browser) */
        input[type=number]::-webkit-outer-spin-button,
        input[type=number]::-webkit-inner-spin-button {
            -webkit-appearance: none;
            margin: 0;
        }

        input[type=number] {
            -moz-appearance: textfield;
        }

        /* Bottom nav touch targets: minimum 48px height on mobile */
        @media (max-width: 640px) {

            /* Stack comparative metrics vertically on small screens */
            .metrics-grid {
                grid-template-columns: 1fr 1fr !important;
            }

            /* Prevent cards from overflowing */
            .glass-panel {
                min-width: 0;
                word-break: break-word;
            }

            /* Bottom nav adjustments */
            .bottom-nav-btn {
                min-width: 0 !important;
                flex: 1;
                padding-left: 4px !important;
                padding-right: 4px !important;
            }

            /* Tables scroll horizontally without breaking layout */
            .overflow-x-auto {
                -webkit-overflow-scrolling: touch;
            }

            /* Slider thumb bigger for touch */
            input[type=range]::-webkit-slider-thumb {
                height: 32px;
                width: 32px;
            }
        }

        @media (max-width: 768px) {

            /* Ensure cards don't overflow on tablets */
            .max-w-5xl,
            .max-w-6xl {
                padding-left: 1rem;
                padding-right: 1rem;
            }
        }
    </style>

</head>

<body>

    <!-- Logo KASTON embebido directamente en base64 -->

    <!-- El Código de la App envuelto para compilación en caliente -->
    <script type="text/babel">
        const { useState, useMemo, useEffect, useRef } = React;
        const { jsPDF } = window.jspdf;
        const exchangeRates = {
            USD: 0.00025, // 1 COP a USD
            EUR: 0.00023, // 1 COP a EUR
            COP: 1
        };

        const KASTON_WEIGHT = 12.6; // kg por m2
        const KASTON_UNITS_PER_M2 = 42; // Fijo 42 uds por m2
        const KASTON_UNITS_PER_FT2 = 3.90; // 42 / 10.7639

        const MATERIAL_CONSTANTS = {
            clay: { label: 'Teja de Barro', weight: 44.5, color: '#bd533b' },
            cement: { label: 'Teja de Fibrocemento', weight: 13.0, color: '#8da399' },
            zinc: { label: 'Lámina de Zinc', weight: 4.0, color: '#90a4ae' }
        };

        const PHONE_PREFIXES = [
            { code: '+57', name: 'Colombia' }, { code: '+1', name: 'EE.UU. / CAN' },
            { code: '+52', name: 'México' }, { code: '+54', name: 'Argentina' },
            { code: '+55', name: 'Brasil' }, { code: '+56', name: 'Chile' },
            { code: '+51', name: 'Perú' }, { code: '+58', name: 'Venezuela' },
            { code: '+593', name: 'Ecuador' }, { code: '+591', name: 'Bolivia' },
            { code: '+595', name: 'Paraguay' }, { code: '+598', name: 'Uruguay' },
            { code: '+507', name: 'Panamá' }, { code: '+503', name: 'El Salvador' },
            { code: '+502', name: 'Guatemala' }, { code: '+506', name: 'Costa Rica' },
            { code: '+1809', name: 'R. Dominicana' }, { code: '+34', name: 'España' },
            { code: '+44', name: 'Reino Unido' }, { code: '+49', name: 'Alemania' },
            { code: '+33', name: 'Francia' }, { code: '+39', name: 'Italia' },
            { code: '+971', name: 'Emiratos Árabes' }, { code: '+61', name: 'Australia' },
        ];

        const KASTON_COLORS = [
            { id: 'grafito', hex: '#2a2a2a', nameEs: 'Negro Grafito', nameEn: 'Graphite Black', descEs: 'Color estrella. Nuestra firma.', star: true },
            { id: 'wengue',  hex: '#5c3d2e', nameEs: 'Café Wengué',   nameEn: 'Wengué Brown',   descEs: 'Calidez natural.',            star: false },
            { id: 'basalto', hex: '#6b6b6b', nameEs: 'Gris Basalto',  nameEn: 'Basalt Gray',    descEs: 'Arquitectura moderna.',        star: false },
            { id: 'militar', hex: '#4B5320', nameEs: 'Verde Militar',  nameEn: 'Military Green', descEs: 'Integración natural.',         star: false },
        ];

                const ROOF_TYPES = [
  { id: "dos-aguas", name: "A Dos Aguas", imagePath: "./Tipos de techos/dos-aguas.png", description: "Estructura de dos caras inclinadas que suben y se unen en el centro, formando un triángulo en el frente." },
  { id: "cuatro-aguas", name: "A Cuatro Aguas", imagePath: "./Tipos de techos/cuatro-aguas.png", description: "Estructura de cuatro caras inclinadas que bajan hacia cada esquina de la propiedad, sin dejar paredes altas." },
  { id: "techo-l", name: "Techo en L / Intersección", imagePath: "./Tipos de techos/combinado.png", description: "Estructura en forma de L donde dos techos inclinados se cruzan, creando una línea de unión en la esquina donde se juntan." },
  { id: "mansarda", name: "Mansarda", imagePath: "./Tipos de techos/hastial-holandes.png", description: "Techo de cuatro lados con un quiebre de doble pendiente: muy empinado en la base y casi plano en la parte superior." },
  { id: "gambrel", name: "Gambrel / Tipo Granero", imagePath: "./Tipos de techos/gambrel.png", description: "Techo que presenta dos pendientes laterales a cada lado, quebrándose hacia afuera en los costados." },
  { id: "mariposa", name: "Mariposa", imagePath: "./Tipos de techos/mariposa.png", description: "Diseño invertido en forma de 'V', donde los extremos exteriores son elevados y el centro es hondo." },
  { id: "saltbox", name: "Saltbox", imagePath: "./Tipos de techos/saltbox.png", description: "Diseño asimétrico donde una caída del techo es corta y la otra es un plano largo que baja casi hasta el suelo." },
  { id: "jerkinhead", name: "Jerkinhead", imagePath: "./Tipos de techos/jerkinhead.png", description: "Base a dos aguas tradicional, pero con las puntas superiores de los extremos recortadas por una pequeña caída diagonal." },
  { id: "bonete", name: "Techo con Bonete", imagePath: "./Tipos de techos/bonete.png", description: "Techo a cuatro aguas que en la parte inferior cambia de inclinación, extendiéndose hacia afuera con una pendiente más plana." },
  { id: "cobertizo", name: "Cobertizo / Una Sola Vertiente", imagePath: "./Tipos de techos/cobertizo-v2.png", description: "Estructura compuesta por una sola rampa recta e inclinada que va de un extremo al otro de la construcción." },
  { id: "piramidal", name: "Techo Piramidal", imagePath: "./Tipos de techos/dos-aguas-alt.png", description: "Diseño de cuatro caras triangulares idénticas que suben de forma simétrica hasta unirse en una sola punta central." },
  { id: "hastial-holandes", name: "Hastial Holandés", imagePath: "./Tipos de techos/mansarda.png", description: "Base inclinada a cuatro aguas que lleva un pequeño triángulo clásico montado en la parte más alta de la cumbrera." },
  { id: "hexagonal", name: "Hexagonal", imagePath: "./Tipos de techos/buhardilla.png", description: "Estructura geométrica de seis caras triangulares iguales que suben y cierran en punta sobre una planta hexagonal." },
  { id: "buhardilla", name: "Techo con Buhardilla", imagePath: "./Tipos de techos/piramidal.png", description: "Techo inclinado del cual sobresale una pequeña estructura vertical independiente con su propia ventana y tejado." },
  { id: "monitor", name: "Monitor", imagePath: "./Tipos de techos/monitor.png", description: "Techo interrumpido por un volumen central que se eleva hacia arriba y lleva ventanas rectangulares en los laterales." },
  { id: "dientes-sierra", name: "Dientes de Sierra", imagePath: "./Tipos de techos/dientes-sierra.png", description: "Secuencia repetitiva de techos asimétricos en cadena, combinando rampas inclinadas con paredes verticales." },
  { id: "otro", name: "Otro / Diseño Especial", imagePath: null, description: "Estructuras personalizadas, techos curvos o configuraciones arquitectónicas complejas que no entran en los modelos estándar." }
];

        /* ── Carga una imagen local para el PDF ── */
        const loadImageAsBase64 = (imageUrl) => new Promise((resolve) => {
            if (!imageUrl) { resolve(null); return; }
            try {
                const img = new Image();
                img.crossOrigin = 'anonymous';
                img.onload = () => {
                    try {
                        const canvas = document.createElement('canvas');
                        canvas.width = img.width || 300; canvas.height = img.height || 188;
                        const ctx = canvas.getContext('2d');
                        ctx.drawImage(img, 0, 0);
                        resolve(canvas.toDataURL('image/png'));
                    } catch(e) { resolve(null); }
                };
                img.onerror = () => resolve(null);
                img.src = new URL(imageUrl, window.location.href).href;
            } catch(e) { resolve(null); }
        });

        /* ── Carga el logo KASTON como PNG para incrustar en el PDF ── */
        const loadLogoForPDF = () => new Promise((resolve) => {
            try {
                const img = new Image();
                img.crossOrigin = 'anonymous';
                img.onload = () => {
                    try {
                        const canvas = document.createElement('canvas');
                        canvas.width = 360; canvas.height = 100;
                        const ctx = canvas.getContext('2d');
                        ctx.drawImage(img, 0, 0, 360, 100);
                        resolve(canvas.toDataURL('image/png'));
                    } catch(e) { resolve(null); }
                };
                img.onerror = () => resolve(null);
                img.src = new URL('logo-kaston.svg', window.location.href).href;
            } catch(e) { resolve(null); }
        });

        /* ── Constructor de PDF premium KASTON ── */
        const buildPremiumPDF = (doc, data, logoDataUrl) => {
            const {
                flow, area, unit, areaM2, material, currency, metrics, modality,
                roofType, pendiente, selectedColor, constructionType,
                clientName, clientPhone, clientDoc, clientRole,
                withObservation, includeZincWaiver, t, isSpecialDesign, roofPngUrl, selectedColorHex
            } = data;

            const C = {
                dark:   [13,  13,  13 ],
                bronze: [193, 138, 104],
                white:  [255, 255, 255],
                offWhite:[248,247,245 ],
                mid:    [160, 160, 160],
                dim:    [110, 110, 110],
                ink:    [30,  30,  30 ],
                stripe: [245, 244, 242],
                red:    [180, 60,  60 ],
            };
            const pageW = 210;
            const col1 = 18, col2 = 110;

            /* ── HEADER ── */
            doc.setFillColor(...C.dark);
            doc.rect(0, 0, pageW, 44, 'F');
            doc.setFillColor(...C.bronze);
            doc.rect(0, 44, pageW, 1.5, 'F');

            if (logoDataUrl) {
                doc.addImage(logoDataUrl, 'PNG', col1, 10, 48, 13.3);
            } else {
                doc.setFont('helvetica', 'bold');
                doc.setFontSize(20);
                doc.setTextColor(...C.white);
                doc.text('KASTON', col1, 22);
            }

            doc.setFont('helvetica', 'normal');
            doc.setFontSize(8);
            doc.setTextColor(...C.bronze);
            doc.text(t.pdfReportTitle, col1, logoDataUrl ? 27 : 30);

            const dateStr = new Date().toLocaleDateString('es-CO', { year:'numeric', month:'long', day:'numeric' });
            doc.setFontSize(7.5);
            doc.setTextColor(...C.mid);
            doc.text(dateStr, pageW - col1, 38, { align: 'right' });

            /* ── BANDA CLIENTE ── */
            doc.setFillColor(...C.stripe);
            doc.rect(0, 45.5, pageW, 14, 'F');
            doc.setFont('helvetica', 'bold');
            doc.setFontSize(6.5);
            doc.setTextColor(...C.dim);
            doc.text(t.pdfClientData, col1, 51);
            doc.setFont('helvetica', 'normal');
            doc.setFontSize(7.5);
            doc.setTextColor(...C.ink);
            const clientLine = `${t.pdfClientName} ${clientName}  ·  ${t.pdfClientPhone} ${clientPhone}  ·  ${t.pdfClientDoc} ${clientDoc}  ·  ${clientRole}`;
            doc.text(clientLine, col1, 56.5);

            /* ── helper: cabecera de sección ── */
            let y = 65;
            const sectionHeader = (label) => {
                doc.setFillColor(...C.bronze);
                doc.rect(col1, y, 3, 5, 'F');
                doc.setFont('helvetica', 'bold');
                doc.setFontSize(10);
                doc.setTextColor(...C.ink);
                doc.text(label, col1 + 5, y + 4);
                y += 10;
            };
            const row = (label, value, bold = false) => {
                doc.setFont('helvetica', bold ? 'bold' : 'normal');
                doc.setFontSize(8.5);
                doc.setTextColor(...C.dim);
                doc.text(label, col1 + 4, y);
                doc.setFont('helvetica', bold ? 'bold' : 'normal');
                doc.setTextColor(...C.ink);
                doc.text(String(value), col2, y);
                y += 6;
            };
            const divider = () => {
                doc.setDrawColor(...C.bronze);
                doc.setLineWidth(0.3);
                doc.line(col1, y, pageW - col1, y);
                y += 5;
            };

            const activeRoof = ROOF_TYPES.find(r => r.id === roofType);
            const pendienteLabel = pendiente === null || pendiente === undefined
                ? t.pitchUnknown
                : `${pendiente}%`;
            const colorLabel = KASTON_COLORS.find(c => c.id === selectedColor)?.nameEs || '—';
            const matLabel = MATERIAL_CONSTANTS[material]?.label || material;

            /* ── SECCIÓN 1: CONFIGURACIÓN ── */
            sectionHeader(t.pdfP1);
            row(t.pdfRoofArea, `${area} ${unit}  (≈ ${areaM2.toFixed(1)} m²)`);
            row(t.pdfConstrType, constructionType);
            if (flow === 'A') row(t.pdfP1TradMat, matLabel);
            row(t.pdfRoofTypeLabel, activeRoof ? (activeRoof.name) : '—');
            row(t.pdfPendienteLabel, pendienteLabel);
            
            // Render color with a hex block if available
            doc.setFont('helvetica', 'normal');
            doc.setFontSize(8.5);
            doc.setTextColor(...C.dim);
            doc.text(t.pdfColorLabel, col1 + 4, y);
            doc.setTextColor(...C.ink);
            doc.text(colorLabel, col2, y);
            if (selectedColorHex) {
                doc.setFillColor(selectedColorHex);
                doc.rect(col2 + doc.getTextWidth(colorLabel) + 3, y - 2.5, 4, 4, 'F');
                doc.setDrawColor(...C.mid);
                doc.setLineWidth(0.1);
                doc.rect(col2 + doc.getTextWidth(colorLabel) + 3, y - 2.5, 4, 4, 'S');
            }
            y += 6;

            if (roofPngUrl) {
                doc.addImage(roofPngUrl, 'PNG', pageW - 75, 65, 55, 34);
            }

            divider();

            /* ── SECCIÓN 2: INVENTARIO & FINANCIERO ── */
            if (isSpecialDesign) {
                sectionHeader('DISEÑO ARQUITECTÓNICO ESPECIAL');
                doc.setFont('helvetica', 'normal');
                doc.setFontSize(9);
                doc.setTextColor(...C.ink);
                doc.text('Este proyecto requiere una Revisión de Consultoría de Ingeniería Personalizada. Debido a la complejidad y características únicas de su estructura, hemos omitido los cálculos estándar. Un ingeniero especializado de KASTON se pondrá en contacto con usted para realizar una evaluación técnica detallada.', col1 + 4, y, { maxWidth: pageW - col1 * 2 - 8, lineHeightFactor: 1.5 });
                y += 20;
                divider();
            } else {
                if (flow === 'A') {
                    sectionHeader(t.pdfP2);
                    row(t.pdfReqUnits, `${metrics.units} uds`, true);
                    divider();
                    sectionHeader(t.pdfP3);
                    row(t.pdfDeadLoadRelief, `${metrics.weightSavedTons} ${t.pdfTonsEl}`, true);
                    divider();
                } else {
                    sectionHeader(t.pdfSpecTitle);
                    row(t.pdfRollThick, '8 mm espesor, estabilizado UV');
                    divider();
                    sectionHeader(t.pdfP2Req);
                    row(t.pdfNetVol, `${metrics.units} uds`, true);
                    divider();
                    sectionHeader(t.pdfCapExtStab);
                    row(t.pdfIzodConf, '29.4 J/m');
                    divider();
                }

                /* ── SECCIÓN 3: FINANCIERO & ESG ── */
                sectionHeader(t.pdfESGTitle);
                const sym = currency === 'EUR' ? '€' : '$';
                const invAmount = modality === 'full' ? metrics.finalCostTodoCosto : metrics.finalCost;
                const invLabel  = modality === 'full' ? t.pdfInvAllInc : t.pdfInvTileOnly;
                doc.setFont('helvetica', 'bold');
                doc.setFontSize(11);
                doc.setTextColor(...C.bronze);
                doc.text(`${sym} ${formatCurrency(invAmount, currency)} ${currency}`, col1 + 4, y);
                y += 6;
                doc.setFont('helvetica', 'normal');
                doc.setFontSize(7.5);
                doc.setTextColor(...C.dim);
                doc.text(invLabel, col1 + 4, y);
                y += 7;
                row(t.pdfUpcycledTitle, `${metrics.plasticUpcycled.toFixed(1)} kg`);
                row(t.pdfCO2RedTitle,   `${metrics.co2Reduced.toFixed(1)} kg`);
                divider();
            }

            /* ── SECCIÓN 4: ALCANCE Y VISITA TÉCNICA ── */
            sectionHeader(t.pdfExecProt);
            doc.setFont('helvetica', 'normal');
            doc.setFontSize(8.5);
            doc.setTextColor(...C.ink);
            doc.text(`· ${t.pdfKastonOp}`,   col1 + 4, y); y += 5.5;
            doc.text(`· ${t.pdfMampos}`,      col1 + 4, y); y += 5.5;
            doc.text(`· ${t.pdfStructPort}`,  col1 + 4, y); y += 5.5;
            doc.setFontSize(7.5);
            doc.setTextColor(...C.dim);
            doc.text(t.pdfVisitNote,   col1 + 4, y); y += 4.5;
            doc.text(t.pdfClientAuton, col1 + 4, y); y += 4.5;
            doc.text(t.pdfKastonTeam,  col1 + 4, y); y += 8;

            /* ── CLÁUSULA ZINC ── */
            if (includeZincWaiver) {
                doc.setFillColor(254, 242, 242);
                doc.rect(col1, y, pageW - col1*2, 38, 'F');
                doc.setFontSize(7);
                doc.setTextColor(...C.red);
                const zinc = [t.pdfZincObs1,t.pdfZincObs2,t.pdfZincObs3,t.pdfZincObs4,t.pdfZincObs5,t.pdfZincObs6];
                zinc.forEach(line => { doc.text(line, col1 + 3, y + 5); y += 5; });
                y += 8;
            }

            /* ── OBSERVACIÓN ESTRUCTURAL ── */
            if (withObservation) {
                doc.setFont('helvetica', 'bold');
                doc.setFontSize(9);
                doc.setTextColor(...C.ink);
                doc.text(t.pdfObs, col1, y); y += 6;
                doc.setFont('helvetica', 'normal');
                doc.setFontSize(8);
                doc.text(t.pdfObsText, col1, y); y += 8;
            }

            /* ── FOOTER ── */
            doc.setFillColor(...C.dark);
            doc.rect(0, 282, pageW, 15, 'F');
            doc.setFont('helvetica', 'normal');
            doc.setFontSize(7);
            doc.setTextColor(...C.mid);
            doc.text('KASTON® · kaston.proyectos@gmail.com · kastonproyectos.com', col1, 291);
            doc.text(t.pdfReportTitle, pageW - col1, 291, { align: 'right' });
        };

        const formatCurrency = (value, currency = 'COP') => {
            let num = Number(value);
            if (isNaN(num)) return value;
            return num.toLocaleString('es-CO', {
                minimumFractionDigits: currency === 'COP' ? 0 : 2,
                maximumFractionDigits: currency === 'COP' ? 0 : 2
            }).replace(/,/g, '.');
        };

        const calculateMetrics = (m2, materialType = 'clay', currency = 'COP', rates = exchangeRates) => {
            const units = m2 * KASTON_UNITS_PER_M2; // Sin margen de desperdicio 3%
            const selectedMaterial = MATERIAL_CONSTANTS[materialType] || MATERIAL_CONSTANTS.clay;
            const traditionalWeight = m2 * selectedMaterial.weight;
            const kastonWeight = m2 * KASTON_WEIGHT;
            const weightSavedKg = traditionalWeight - kastonWeight;
            const weightSavedTons = weightSavedKg / 1000;

            const T_Kaston_m2 = 85000;
            const TEJA_kaston_todo_Costo = 106623;

            let costOnlyTejaCOP = m2 * T_Kaston_m2;
            let costTodoCostoCOP = m2 * TEJA_kaston_todo_Costo;

            let rate = rates[currency] || 1;
            let finalCostOnlyTeja = costOnlyTejaCOP * rate;
            let finalCostTodoCosto = costTodoCostoCOP * rate;

            const plasticUpcycled = m2 * 11;
            const co2Reduced = m2 * 18.5;

            return {
                units: Math.ceil(units),
                weightSavedTons: Number(weightSavedTons.toFixed(2)),
                finalCost: Number(finalCostOnlyTeja.toFixed(2)),
                finalCostTodoCosto: Number(finalCostTodoCosto.toFixed(2)),
                plasticUpcycled: Number(plasticUpcycled.toFixed(1)),
                co2Reduced: Number(co2Reduced.toFixed(1))
            };
        };

        // Animación del número suave
        function AnimatedNumber({ value, decimals = 0 }) {
            const [current, setCurrent] = useState(value);

            useEffect(() => {
                let frame;
                const speed = 0.15;
                const update = () => {
                    setCurrent(prev => {
                        const diff = value - prev;
                        if (Math.abs(diff) < 0.1) return value;
                        return prev + diff * speed;
                    });
                    frame = requestAnimationFrame(update);
                };
                frame = requestAnimationFrame(update);
                return () => cancelAnimationFrame(frame);
            }, [value]);

            return <span>{current.toFixed(decimals)}</span>;
        }

        function Gauge({ value, max, label, sublabel, color, decimals = 0, suffix = '', prefix = '' }) {
            const size = 160;
            const strokeWidth = 12;
            const radius = (size - strokeWidth) / 2;
            const circumference = radius * 2 * Math.PI;
            const percentage = Math.min((value / max) * 100, 100);
            const offset = circumference - (percentage / 100) * circumference;

            return (
                <div className="flex flex-col items-center relative gap-2">
                    <div className="relative" style={{ width: size, height: size }}>
                        <svg className="w-full h-full transform -rotate-90" width={size} height={size} viewBox={`0 0 ${size} ${size}`}>
                            <circle cx={size / 2} cy={size / 2} r={radius} strokeWidth={strokeWidth} stroke="rgba(255,255,255,0.1)" fill="none" />
                            <circle
                                cx={size / 2} cy={size / 2} r={radius}
                                strokeWidth={strokeWidth} stroke={color} fill="none" strokeLinecap="round"
                                style={{
                                    strokeDasharray: circumference,
                                    strokeDashoffset: offset,
                                    transition: 'stroke-dashoffset 0.8s cubic-bezier(0.4, 0, 0.2, 1)',
                                    filter: `drop-shadow(0 0 8px ${color}80)`
                                }}
                            />

                            <span className="text-2xl font-bold tracking-tight text-white drop-shadow-md" style={{ color }}>
                                {prefix}<AnimatedNumber value={value} decimals={decimals} />{suffix}
                            </span>
                            <span className="text-xs text-white/50">{sublabel}</span>
                        </div>
                    </div>
                    {label && <div className="text-sm font-semibold tracking-wide text-white uppercase text-center mt-2">{label}</div>}

        function InfoTooltip({ title, description, technicalValue }) {
            const [isVisible, setIsVisible] = useState(false);
            const iconRef = useRef(null);
            const tooltipRef = useRef(null);
            const [position, setPosition] = useState({ top: 0, left: 0, isBelow: false });

            useEffect(() => {
                if (isVisible && iconRef.current) {
                    const rect = iconRef.current.getBoundingClientRect();
                    const topSpace = rect.top;

                    // Defaults
                    let isBelow = false;
                    let top = rect.top - 10; // 10px spacing above the icon

                    // Smart Collision: If less than 150px space above, render BELOW the icon
                    if (topSpace < 150) {
                        isBelow = true;
                        top = rect.bottom + 10;
                    }

                    // Smart Collision: Horizontal Centering & Window Bounds
                    let left = rect.left + (rect.width / 2); // Center of icon
                    const assumedTooltipWidth = 240; // max-w-xs approx width handling

                    if (left - (assumedTooltipWidth / 2) < 20) {
                        left = 20 + (assumedTooltipWidth / 2);
                    } else if (left + (assumedTooltipWidth / 2) > window.innerWidth - 20) {
                        left = window.innerWidth - 20 - (assumedTooltipWidth / 2);
                    }

                    setPosition({ top, left, isBelow });

        function PhoneInput({ value, onChange, language, required }) {
            const detect = (v) => {
                if (!v) return { prefix: '+57', number: '' };
                const match = PHONE_PREFIXES.slice().sort((a,b) => b.code.length - a.code.length)
                    .find(p => v.startsWith(p.code));
                if (match) return { prefix: match.code, number: v.slice(match.code.length).trim() };
                return { prefix: '+57', number: v };
            };
            const init = detect(value);
            const [prefix, setPrefix] = useState(init.prefix);
            const [number, setNumber] = useState(init.number);

            const emit = (p, n) => onChange(`${p} ${n}`);
            const onPfx = (e) => { setPrefix(e.target.value); emit(e.target.value, number); };
            const onNum = (e) => { const n = e.target.value.replace(/\D/g,''); setNumber(n); emit(prefix, n); };

            return (
                <div className="flex gap-2">
                    <select value={prefix} onChange={onPfx}
                        className="bg-black/50 border border-white/10 rounded-xl p-3 text-white focus:outline-none focus:border-bronze transition-all shadow-inner cursor-pointer appearance-none text-sm"
                        style={{ minWidth:'130px' }}>
                        {PHONE_PREFIXES.map(p => (

                    <input type="tel" required={required} value={number} onChange={onNum}

            const [material, setMaterial] = useState('clay');

            const [selectedColor, setSelectedColor] = useState(editingProject ? (editingProject.selectedColor || null) : null);

            useEffect(() => {
                setUnit(defaults.unit);
                setCurrency(defaults.currency);
            }, [defaults]);

            const handleUnitChange = (e) => {
                const newUnit = e.target.value;
                if (newUnit === unit) return;

                let newVal;
                if (newUnit === 'ft2') {
                    newVal = Number((inputValue * 10.7639).toFixed(2));
                } else {
                    newVal = Number((inputValue / 10.7639).toFixed(2));
                }
                setInputValue(newVal);
                setInputText(String(newVal));
                setUnit(newUnit);
            };

            const areaM2 = unit === 'ft2' ? inputValue / 10.7639 : inputValue;
            const metrics = useMemo(() => calculateMetrics(areaM2, material, currency, rates), [areaM2, material, currency, rates]);

            const sliderMin = unit === 'ft2' ? 10.76 : 1;
            const sliderMax = unit === 'ft2' ? 16145.85 : 1500;
            const sliderStep = unit === 'ft2' ? 0.01 : 1;

            const activeRoofObj = ROOF_TYPES.find(r => r.id === roofType);

            const isFormComplete = Boolean(
                roofType &&
                selectedColor &&
                (isSpecialDesign || (
                    modality &&
                    pendiente !== undefined &&
                    (pendiente === null || (typeof pendiente === 'number' && pendiente >= 15))
                ))
            );

                try {
                    const doc = new jsPDF();
                    const logoDataUrl = await loadLogoForPDF();
                    const activeRoofObjForSvg = ROOF_TYPES.find(r => r.id === roofType);
                    const roofPngUrl = activeRoofObjForSvg?.imagePath ? await loadImageAsBase64(activeRoofObjForSvg.imagePath) : null;

                    const meta = session?.user?.user_metadata || {};
                    const clientName = meta.full_name || session?.user?.email?.split('@')[0] || t.pdfClientUnreg;
                    buildPremiumPDF(doc, {
                        t, flow: flowActive, area: inputValue, unit, areaM2,
                        material, currency, metrics, modality,
                        roofType, pendiente, selectedColor,
                        constructionType, isSpecialDesign, roofPngUrl, selectedColorHex,
                        clientName,
                        clientPhone: meta.phone       || t.pdfClientUnreg,
                        clientDoc:   meta.id_number ? `${meta.id_type||''} ${meta.id_number}`.trim() : t.pdfClientUnreg,

        }

        function MainDashboard({ onLogout, session, extraData, onAuth }) {
            const [showWelcomeModal, setShowWelcomeModal] = useState(() => !sessionStorage.getItem('kaston_welcomed'));
            const [currentTab, setCurrentTab] = useState(() => sessionStorage.getItem('kaston_currentTab') || 'triage');
            const [projects, setProjects] = useState([]);
            const [language, setLanguage] = useState('es');
            const [triageFlow, setTriageFlow] = useState(() => sessionStorage.getItem('kaston_triageFlow') || null);
            const [rates, setRates] = useState(exchangeRates);

            useEffect(() => {
                fetch('https://open.er-api.com/v6/latest/COP')
                    .then(res => res.json())
                    .then(data => {
                        if (data && data.result === 'success') {
                            setRates({ COP: 1, USD: data.rates.USD, EUR: data.rates.EUR });
                        }
                    })
                    .catch(console.error);
            }, []);

            useEffect(() => {
                sessionStorage.setItem('kaston_currentTab', currentTab);
            }, [currentTab]);

            useEffect(() => {
                if (triageFlow) sessionStorage.setItem('kaston_triageFlow', triageFlow);
                else sessionStorage.removeItem('kaston_triageFlow');
            }, [triageFlow]);
            const userName = extraData?.fullName || session?.user?.user_metadata?.full_name || session?.user?.email?.split('@')[0] || 'Ingeniero';
            const userEmail = session?.user?.email || '';
            const [settings, setSettings] = useState({
                name: userName,
                role: session?.user?.user_metadata?.role || 'Propietario',
                currency: 'COP',
                unit: 'm2'
            });
            const [editingProject, setEditingProject] = useState(null);

            const handleSaveProject = async (proj) => {
                const fullProj = { ...proj };

                if (editingProject) {
                    setProjects(projects.map(p => p.id === proj.id ? fullProj : p));
                    if (supabase) {
                        try {
                            await supabase.from('projects').update({
                                project_m2: proj.unidad === 'ft2' ? proj.area / 10.764 : proj.area,
                                selected_color: proj.divisa,
                                total_weight_saved: proj.plastico_kg / 1000,
                                plastic_upcycled_kg: proj.plastico_kg,
                                estimated_savings_usd: proj.inversion_tejas,
                                client_name: proj.nombre,
                                project_data: JSON.stringify(fullProj)
                            }).eq('id', proj.id).eq('user_id', session?.user?.id);
                        } catch (err) {
                            // Fallback: update without project_data if column doesn't exist
                            await supabase.from('projects').update({
                                project_m2: proj.unidad === 'ft2' ? proj.area / 10.764 : proj.area,
                                selected_color: proj.divisa,
                                total_weight_saved: proj.plastico_kg / 1000,
                                plastic_upcycled_kg: proj.plastico_kg,
                                estimated_savings_usd: proj.inversion_tejas,
                                client_name: proj.nombre
                            }).eq('id', proj.id).eq('user_id', session?.user?.id);
                        }
                    }
                    setEditingProject(null);
                } else {
                    setProjects([fullProj, ...projects]);
                    if (supabase) {
                        try {
                            await supabase.from('projects').insert([{
                                id: proj.id,
                                user_id: session?.user?.id,
                                project_m2: proj.unidad === 'ft2' ? proj.area / 10.764 : proj.area,
                                selected_color: proj.divisa,
                                total_weight_saved: proj.plastico_kg / 1000,
                                plastic_upcycled_kg: proj.plastico_kg,
                                estimated_savings_usd: proj.inversion_tejas,
                                client_name: proj.nombre,
                                project_data: JSON.stringify(fullProj),
                                created_at: new Date().toISOString()
                            }]);
                        } catch (err) {
                            // Fallback: insert without project_data if column doesn't exist
                            await supabase.from('projects').insert([{
                                id: proj.id,
                                user_id: session?.user?.id,
                                project_m2: proj.unidad === 'ft2' ? proj.area / 10.764 : proj.area,
                                selected_color: proj.divisa,
                                total_weight_saved: proj.plastico_kg / 1000,
                                plastic_upcycled_kg: proj.plastico_kg,
                                estimated_savings_usd: proj.inversion_tejas,
                                client_name: proj.nombre,
                                created_at: new Date().toISOString()
                            }]);
                        }
                    }
                }
                setTimeout(() => {
                    setTriageFlow(null);
                    setCurrentTab('triage');
                }, 100);
            };

            const handleEditProject = (proj) => {
                setSettings({ ...settings, unit: proj.unidad, area: proj.area });
                setTriageFlow(proj.flow);
                setEditingProject(proj);
                setCurrentTab('dashboard');
            };

            const handleDeleteProject = async (id) => {
                if (window.confirm(T[language]?.deleteConfirm || T['es'].deleteConfirm)) {
                    setProjects(projects.filter(p => p.id !== id));
                    if (supabase) {
                        await supabase.from('projects').delete().eq('id', id);
                    }
                }
            };

            const getMailtoLink = (proj) => {
                const targetProj = proj;
                if (!targetProj) return '#';
                const subject = encodeURIComponent(`Cotización - ${targetProj?.tipoConstruccion || 'Proyecto'}`);
                const body = encodeURIComponent(`Nombre de la persona: ${userName}\nCorreo de la persona: ${userEmail}\n\nAdjunto la cotización generada automáticamente por la plataforma KASTON.\n\nPOR FAVOR, ADJUNTE EN ESTE CORREO EL PDF GENERADO DESCARGADO Y LAS IMÁGENES DE REFERENCIA DE LA CONSTRUCCIÓN A COTIZAR.\n\nDetalles del proyecto:\n- Nombre: ${targetProj?.nombre}\n- Tipo de construcción: ${targetProj?.tipoConstruccion}\n- Área: ${targetProj?.area} ${targetProj?.unidad}\n- Inversión estimada: $${targetProj?.inversion_tejas?.toLocaleString()} ${targetProj?.divisa}`);
                return `mailto:kaston.proyectos@gmail.com?subject=${subject}&body=${body}`;
            };

            const handleQuoteProject = (proj) => {
                window.location.href = getMailtoLink(proj);
            };

            const handleLanguageChange = (langVal) => {
                setLanguage(langVal);
                localStorage.setItem('kastonLang', langVal);
                document.documentElement.lang = langVal;
            };

            useEffect(() => {
                const savedLang = localStorage.getItem('kastonLang') || 'es';
                setLanguage(savedLang);
                document.documentElement.lang = savedLang;
            }, []);

            // Load projects from Supabase when session changes
            useEffect(() => {
                if (session && supabase) {
                    supabase
                        .from('projects')
                        .select('*')
                        .order('created_at', { ascending: false })
                        .then(({ data, error }) => {
                            if (data && !error) {
                                const loaded = data.map(p => {
                                    // Try to restore full project from project_data JSON
                                    if (p.project_data) {
                                        try { return JSON.parse(p.project_data); } catch (e) { }
                                    }
                                    // Fallback: reconstruct from individual columns
                                    const storedVal = p.selected_color || '';
                                    const isCurrency = ['COP', 'USD', 'EUR'].includes(storedVal);
                                    return {
                                        id: p.id,
                                        nombre: p.client_name || 'Sin nombre',
                                        area: p.project_m2 || 0,
                                        unidad: 'm2',
                                        inversion_tejas: p.estimated_savings_usd || 0,
                                        plastico_kg: p.plastic_upcycled_kg || 0,
                                        divisa: isCurrency ? storedVal : 'COP',
                                        material: 'clay',
                                        tipoConstruccion: 'clay',
                                        inclinacion: 15,
                                        flow: 'A',
                                        tasas: null
                                    };
                                });
                                setProjects(loaded);
                            }
                        })
                        .catch(console.error);
                } else if (!session) {
                    setProjects([]);
                }
            }, [session]);

            // Prioritize triage upon login
            const prevSession = React.useRef(null);
            React.useEffect(() => {
                if (session && !prevSession.current) {
                    // User just logged in
                    setCurrentTab('triage');
                    setTriageFlow(null);
                }
                prevSession.current = session;
            }, [session]);



            const t = T[language] || T['es'];

            return (
                <div className="min-h-screen bg-graphite font-sans flex flex-col items-center pb-24">
                    {showWelcomeModal && (
                        <WelcomeModal language={language} onAccept={() => {
                            sessionStorage.setItem('kaston_welcomed', '1');
                            setShowWelcomeModal(false);
                        }} />
                    )}
                    <header className="w-full border-b border-white/10 sticky top-0 z-50" style={{ backgroundColor: '#0E0E0E' }}>
                        <div className="max-w-6xl mx-auto px-4 py-3 flex items-center justify-between w-full gap-3">
                            <div className="flex items-center gap-3 flex-shrink-0">
                                {typeof KASTON_LOGO !== 'undefined' ? (
                                    <img src={KASTON_LOGO} alt="KASTON" width="231" height="130" style={{ height: 'clamp(55px, 10vw, 130px)', width: 'auto', objectFit: 'contain', imageRendering: 'crisp-edges', filter: 'drop-shadow(0px 2px 4px rgba(0,0,0,0.2))', flexShrink: 0 }} />
                                ) : (
                                    <div className="flex items-center gap-3">
                                        <div className="w-8 h-8 rounded bg-bronze text-[#0D0D0D] flex items-center justify-center font-bold shadow-[0_0_15px_rgba(193,138,104,0.5)]">K</div>
                                        <h1 className="text-xl font-bold tracking-wider">KASTON</h1>
                                    </div>
                                )}
                            </div>
                            <div className="flex items-center gap-3 ml-auto flex-shrink-0">
                                <div className="flex bg-transparent border border-white/20 rounded-full overflow-hidden">
                                    <button onClick={() => handleLanguageChange('es')} className={`px-3 py-1 text-xs transition-colors cursor-pointer ${language === 'es' ? 'bg-bronze text-graphite font-bold' : 'text-white/50 hover:text-white'}`}>ES</button>
                                    <button onClick={() => handleLanguageChange('en')} className={`px-3 py-1 text-xs transition-colors cursor-pointer ${language === 'en' ? 'bg-bronze text-graphite font-bold' : 'text-white/50 hover:text-white'}`}>EN</button>
                                </div>
                                {session && (
                                    <button onClick={() => { onLogout(); setCurrentTab('profile'); }} className="text-xs text-white/30 hover:text-bronze uppercase tracking-widest transition-colors cursor-pointer border border-white/10 hover:border-bronze px-3 py-1 rounded">{t.logout}</button>
                                )}
                            </div>
                        </div>
                    </header>

                    <main className="w-full flex-grow flex flex-col items-center py-10 px-4 md:px-6" style={{ overflowY: 'visible' }}>
                        {currentTab === 'triage' && <TriageScreen language={language} onSelectFlow={(flow) => {
                            setTriageFlow(flow);
                            setCurrentTab('dashboard');
                        }} />}
                        {currentTab === 'dashboard' && <CalculatorTab language={language} defaults={settings} onSaveProject={handleSaveProject} editingProject={editingProject} defaultFlow={triageFlow || 'A'} session={session} setCurrentTab={setCurrentTab} setTriageFlow={setTriageFlow} rates={rates} />}
                        {currentTab === 'projects' && (
                            session ? <ProjectsTab language={language} session={session} projects={projects} onEditProject={handleEditProject} onDeleteProject={handleDeleteProject} onQuoteProject={handleQuoteProject} rates={rates} /> :
                                <div className="w-full flex-grow flex flex-col items-center justify-center p-8 mt-20 text-center animate-fade-in"><p className="text-white/50 tracking-widest uppercase mb-6 text-sm">{t.authReq}</p><h2 className="text-2xl font-bold text-white mb-8 border-b border-white/10 pb-4">{t.loginToView}</h2><button onClick={() => setCurrentTab('profile')} className="bg-bronze hover:bg-white text-graphite px-8 py-4 rounded-xl font-bold uppercase tracking-widest transition-colors cursor-pointer shadow-[0_0_20px_rgba(193,138,104,0.3)]">{t.goToProfile}</button></div>
                        )}
                        {currentTab === 'profile' && (
                            session ? <ProfileTab language={language} settings={settings} updateSettings={(newSets) => setSettings({ ...settings, ...newSets })} session={session} extraData={extraData} /> :
                                <AuthScreen language={language} onAuth={onAuth} />
                        )}
                    </main>

                    {/* Bottom Tab Bar */}
                    <div className="fixed bottom-0 left-0 right-0 glass-panel border-t border-white/10 p-2 z-50 flex justify-center pb-safe" style={{ boxShadow: '0 -10px 30px rgba(0,0,0,0.5)' }}>
                        <div className="max-w-md w-full flex justify-around items-center">
                            <button onClick={() => { setCurrentTab('triage'); setTriageFlow(null); }} className={`bottom-nav-btn flex flex-col items-center justify-center p-3 min-w-[6.5rem] w-auto rounded-lg transition-colors duration-300 min-h-[56px] ${currentTab === 'triage' || currentTab === 'dashboard' ? 'text-bronze' : 'text-white/40 hover:text-white/70'}`}>
                                <svg className="w-6 h-6 mb-1" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth={1.5} d="M4 6a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2H6a2 2 0 01-2-2V6zM14 6a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2h-2a2 2 0 01-2-2V6zM4 16a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2H6a2 2 0 01-2-2v-2zM14 16a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2h-2a2 2 0 01-2-2v-2z" /></svg>
                                <span className="text-[10px] uppercase font-bold tracking-widest">{t.bottomDash}</span>
                            </button>
                            <button onClick={() => setCurrentTab('projects')} className={`bottom-nav-btn flex flex-col items-center justify-center p-3 min-w-[6.5rem] w-auto rounded-lg transition-colors duration-300 relative min-h-[56px] ${currentTab === 'projects' ? 'text-bronze' : 'text-white/40 hover:text-white/70'}`}>
                                <svg className="w-6 h-6 mb-1" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth={1.5} d="M19 11H5m14 0a2 2 0 012 2v6a2 2 0 01-2 2H5a2 2 0 01-2-2v-6a2 2 0 012-2m14 0V9a2 2 0 00-2-2M5 11V9a2 2 0 002-2m0 0V5a2 2 0 012-2h6a2 2 0 012 2v2M7 7h10" /></svg>
                                <span className="text-[10px] uppercase font-bold tracking-widest">{t.bottomProj}</span>
                                {projects.length > 0 && <span className="absolute top-2 right-4 bg-bronze border border-graphite w-2 h-2 rounded-full"></span>}
                            </button>
                            <button onClick={() => setCurrentTab('profile')} className={`bottom-nav-btn flex flex-col items-center justify-center p-3 min-w-[6.5rem] w-auto rounded-lg transition-colors duration-300 min-h-[56px] ${currentTab === 'profile' ? 'text-bronze' : 'text-white/40 hover:text-white/70'}`}>
                                <svg className="w-6 h-6 mb-1" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth={1.5} d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z" /></svg>
                                <span className="text-[10px] uppercase font-bold tracking-widest">{t.bottomProf}</span>
                            </button>
                        </div>
                    </div>
                </div>
            );
        }

        function AuthScreen({ onAuth, language }) {
            const t = T[language] || T['es'];
            const [isLogin, setIsLogin] = useState(true);
            const [email, setEmail] = useState('');
            const [password, setPassword] = useState('');
            const [fullName, setFullName] = useState('');
            const [phone, setPhone] = useState('');
            const [role, setRole] = useState('Propietario');
            const [idType, setIdType] = useState('Cédula de Ciudadanía');
            const [idNumber, setIdNumber] = useState('');
            const [profilePhoto, setProfilePhoto] = useState(null);
            const [photoPreview, setPhotoPreview] = useState(null);
            const [loading, setLoading] = useState(false);
            const [error, setError] = useState(null);
            const [confirmMsg, setConfirmMsg] = useState(null);
            const [confirmPassword, setConfirmPassword] = useState('');

            const handlePhotoChange = (e) => {
                const file = e.target.files[0];
                if (file) {
                    setProfilePhoto(file);
                    const reader = new FileReader();
                    reader.onloadend = () => setPhotoPreview(reader.result);
                    reader.readAsDataURL(file);
                }
            };

            const handleSubmit = async (e) => {
                e.preventDefault();
                setError(null);
                setConfirmMsg(null);
                if (!isLogin && !profilePhoto) { setError(t.errPhotoReq); return; }
                if (!isLogin && !fullName.trim()) { setError(t.errNameReq); return; }
                if (!isLogin && !phone.trim()) { setError(t.errPhoneReq); return; }
                if (!isLogin && !idNumber.trim()) { setError(t.errIdReq); return; }
                if (!isLogin && password !== confirmPassword) { setError(t.passMismatch); return; }

                // Identity String Validation Enforcement
                if (!isLogin) {
                    if (idType === 'Pasaporte') {
                        if (!/^[a-zA-Z]{2}\d+$/.test(idNumber)) {
                            setError(t.errPassportFmt);
                            return;
                        }
                    } else {
                        // Cédula, NIT, CE validation (Only numbers)
                        if (!/^\d+$/.test(idNumber)) {
                            setError(`${t.errDocPre} ${idType} ${t.errDocSuf}`);
                            return;
                        }
                    }
                }

                setLoading(true);
                try {

                    if (isLogin) {
                        const { data, error } = await supabase.auth.signInWithPassword({ email, password });
                        if (error) throw error;
                        onAuth(data.session, {});
                    } else {
                        // Upload image Logic simulation (Using Base64 due to Local approach)
                        const storePhotoInDB = photoPreview; // Uses already prepared Base64 string from handler

                        const { data, error } = await supabase.auth.signUp({
                            email,
                            password,
                            options: {
                                data: {
                                    full_name: fullName,
                                    phone: phone,
                                    role: role,
                                    id_type: idType,
                                    id_number: idNumber,
                                    photoPreview: storePhotoInDB // Persisting Base64 string directly into metadata!
                                }
                            }
                        });
                        if (error) throw error;
                        if (data.session) {
                            onAuth(data.session, { fullName, phone, photoPreview, role, idType, idNumber });
                        } else {
                            setConfirmMsg(t.awaitConfirm);
                        }
                    }
                } catch (err) {
                    setError(err.message === 'Invalid login credentials' ? t.errBadCreds : err.message);
                } finally {
                    setLoading(false);
                }
            };

            return (
                <div className="min-h-screen flex items-center justify-center p-4" style={{ backgroundColor: '#0E0E0E' }}>
                    <div className="p-8 rounded-2xl w-full max-w-md border border-white/10 shadow-[0_0_30px_rgba(193,138,104,0.15)] relative overflow-hidden" style={{ backgroundColor: '#0E0E0E' }}>
                        <div className="absolute top-[-50px] right-[-50px] w-40 h-40 bg-bronze rounded-full opacity-10 blur-[50px]"></div>

                        <div className="flex justify-center mb-10 relative z-10">
                            {typeof KASTON_LOGO !== 'undefined' ? (
                                <img src={KASTON_LOGO} alt="KASTON Logo" width="285" height="160" style={{ height: '160px', width: 'auto', objectFit: 'contain', imageRendering: 'crisp-edges', filter: 'drop-shadow(0px 2px 4px rgba(0,0,0,0.2))', margin: '0 auto', display: 'block' }} />
                            ) : (
                                <div className="flex items-center gap-3">
                                    <div className="w-10 h-10 rounded bg-bronze text-[#0D0D0D] flex items-center justify-center font-bold text-2xl shadow-[0_0_15px_rgba(193,138,104,0.5)]">K</div>
                                    <h1 className="text-3xl font-bold tracking-wider text-white">KASTON</h1>
                                </div>
                            )}
                        </div>

                        <h2 className="text-2xl font-heading font-semibold tracking-tight text-white mb-6 text-center relative z-10 uppercase">
                            {isLogin ? t.corpAcc : t.techReg}
                        </h2>

                        {error && <div className="bg-red-500/10 border border-red-500/50 text-red-500 text-sm p-3 rounded-xl mb-4 text-center mt-2">{error}</div>}
                        {confirmMsg && (
                            <div className="bg-green-500/10 border border-green-500/50 text-green-400 text-sm p-4 rounded-xl mb-4 text-center mt-2 leading-relaxed">
                                {confirmMsg}
                            </div>
                        )}

                        <form onSubmit={handleSubmit} className="flex flex-col gap-4 relative z-10">
                            {!isLogin && (
                                <>
                                    <div>
                                        <label className="block text-xs text-white/50 uppercase tracking-widest mb-1 font-semibold">{t.fullName}</label>
                                        <input type="text" required value={fullName} onChange={e => setFullName(e.target.value)} className="w-full bg-black/50 border border-white/10 rounded-xl p-3 text-white focus:outline-none focus:border-bronze focus:ring-1 focus:ring-bronze transition-all shadow-inner" placeholder={t.fullNPlace} />
                                    </div>
                                    <div>
                                        <label className="block text-xs text-white/50 uppercase tracking-widest mb-1 font-semibold">{t.phoneNum} *</label>
                                        <PhoneInput value={phone} onChange={setPhone} language={language} required />
                                    </div>
                                    <div className="grid grid-cols-2 gap-4">
                                        <div>
                                            <label className="block text-xs text-white/50 uppercase tracking-widest mb-1 font-semibold">{t.roleTitle}</label>
                                            <select value={role} onChange={e => setRole(e.target.value)} className="w-full bg-black/50 border border-white/10 rounded-xl p-3 text-white focus:outline-none focus:border-bronze focus:ring-1 focus:ring-bronze transition-all shadow-inner">
                                                <option value="Propietario">{t.roleOwner || 'Propietario'}</option>
                                                <option value="Arquitecto">{t.roleArch || 'Arquitecto'}</option>
                                                <option value="Ingeniero">{t.roleEng || 'Ingeniero'}</option>
                                                <option value="Constructor">{t.roleConst || 'Constructor'}</option>
                                                <option value="Instalador">{t.roleInst || 'Instalador'}</option>
                                                <option value="Desarrollador Inmobiliario">{t.roleDev || 'Desarrollador Inmobiliario'}</option>
                                                <option value="Otro">{t.roleOther || 'Otro'}</option>
                                            </select>
                                        </div>
                                        <div>
                                            <label className="block text-xs text-white/50 uppercase tracking-widest mb-1 font-semibold">{t.idTypeLabel}</label>
                                            <select value={idType} onChange={e => setIdType(e.target.value)} className="w-full bg-black/50 border border-white/10 rounded-xl p-3 text-white focus:outline-none focus:border-bronze focus:ring-1 focus:ring-bronze transition-all shadow-inner">
                                                <option value="Cédula de Ciudadanía">Cédula de C. (CC)</option>
                                                <option value="Cédula de Extranjería">Cédula de E. (CE)</option>
                                                <option value="NIT">NIT</option>
                                                <option value="Pasaporte">Pasaporte</option>
                                            </select>
                                        </div>
                                    </div>
                                    <div>
                                        <label className="block text-xs text-white/50 uppercase tracking-widest mb-1 font-semibold">{t.idNum} *</label>
                                        <input type="text" required value={idNumber}
                                            onChange={e => {
                                                const raw = e.target.value;
                                                if (idType === 'Pasaporte') {
                                                    const letters = raw.slice(0,2).replace(/[^a-zA-Z]/g,'');
                                                    const digits  = raw.slice(2).replace(/\D/g,'');
                                                    setIdNumber((letters + digits).toUpperCase());
                                                } else {
                                                    setIdNumber(raw.replace(/\D/g,''));
                                                }
                                            }}
                                            className="w-full bg-black/50 border border-white/10 rounded-xl p-3 text-white focus:outline-none focus:border-bronze focus:ring-1 focus:ring-bronze transition-all shadow-inner"
                                            placeholder={idType === 'Pasaporte' ? 'AB1234567' : t.idPlace}
                                            inputMode={idType === 'Pasaporte' ? 'text' : 'numeric'} />
                                        <p className="text-[9px] text-white/35 mt-1.5 uppercase tracking-widest">
                                            {idType === 'Pasaporte' ? t.passportFmtHint : t.numericOnlyHint}
                                        </p>
                                    </div>
                                    <div>
                                        <label className="block text-xs text-white/50 uppercase tracking-widest mb-1 font-semibold">{t.profPhoto} *</label>
                                        <div className="flex items-center gap-4">
                                            {photoPreview ? (

        function App() {
            const [session, setSession] = useState(null);
            const [extraData, setExtraData] = useState({});
            const [loading, setLoading] = useState(true);
            const [authChecked, setAuthChecked] = useState(false);
            const [initLang] = useState(() => localStorage.getItem('kastonLang') || 'es');

            const handleAuth = (sess, extra = {}) => {
                setSession(sess);
                setExtraData(extra);
            };

            useEffect(() => {
                const initAuth = async () => {
                    if (supabase && supabase.auth) {
                        try {
                            const sessionPromise = supabase.auth.getSession();
                            const timeoutPromise = new Promise((_, reject) => setTimeout(() => reject(new Error('timeout')), 2500));
                            const { data: { session } } = await Promise.race([sessionPromise, timeoutPromise]);
                            setSession(session);
                        } catch (err) {
                            console.error("Supabase Error / Pausado:", err);
                        } finally {
                            setLoading(false);
                            setAuthChecked(true);
                        }

                        const { data: { subscription } } = supabase.auth.onAuthStateChange((_event, session) => {
                            setSession(session);
                            setAuthChecked(true);
                        });
                        return subscription;
                    } else {
                        setLoading(false);
                        setAuthChecked(true);
                        return null;
                    }
                };

                let sub = null;
                initAuth().then(s => sub = s);

                return () => {
                    if (sub) sub.unsubscribe();
                };
            }, []);

            if (loading || !authChecked) {
                return (
                    <div className="min-h-screen bg-graphite flex flex-col items-center justify-center gap-6">
                        <div className="w-16 h-16 rounded-full border-4 border-bronze border-t-transparent animate-spin"></div>
                        <p className="text-bronze uppercase tracking-widest font-bold text-sm">
                            {initLang === 'en' ? 'Initializing...' : 'Inicializando...'}
                        </p>
                    </div>
                );
            }

            return <MainDashboard session={session} extraData={extraData} onLogout={() => { if (supabase) supabase.auth.signOut(); setSession(null); setExtraData(null); }} onAuth={handleAuth} />;
        }

        function TriageScreen({ language, onSelectFlow }) {
            const t = T[language] || T['es'];
            return (
                <div className="w-full flex-grow flex flex-col justify-start relative pb-12">
                    <div className="fixed top-0 right-0 w-full h-full bg-bronze rounded-full opacity-5 blur-[200px] pointer-events-none" style={{ transform: 'translate(30%, -30%)' }}></div>
                    <div className="fixed bottom-0 left-0 w-full h-full bg-bronze rounded-full opacity-5 blur-[200px] pointer-events-none" style={{ transform: 'translate(-30%, 30%)' }}></div>

                    <div className="max-w-4xl w-full z-10 animate-fade-in flex flex-col items-center pt-8 mb-auto mx-auto pb-8">
                        <div className="mb-10 text-center">
                            {typeof KASTON_LOGO !== 'undefined' ? (
                                <img src={KASTON_LOGO} alt="KASTON" width="231" height="130" style={{ height: '130px', width: 'auto', objectFit: 'contain', imageRendering: 'crisp-edges', filter: 'drop-shadow(0px 2px 4px rgba(0,0,0,0.2))', margin: '0 auto 1rem', display: 'block' }} />
                            ) : (
                                <div className="w-16 h-16 rounded bg-bronze text-[#0D0D0D] flex items-center justify-center font-bold text-4xl mx-auto mb-4 shadow-[0_0_20px_rgba(193,138,104,0.5)]">K</div>
                            )}
                            <h1 className="text-3xl font-heading font-bold tracking-tight text-white uppercase mt-4 mb-2">{t.trTitle}</h1>
                            <p className="text-white/50 tracking-widest text-sm uppercase">{t.trSub}</p>
                        </div>

                        <div className="grid grid-cols-1 md:grid-cols-3 gap-6 w-full">
                            <button onClick={() => onSelectFlow('A')} className="glass-panel p-6 text-left rounded-2xl flex flex-col group hover:border-bronze/50 transition-all duration-300 relative overflow-hidden cursor-pointer">
                                <h3 className="text-xl font-heading font-bold text-white uppercase tracking-wider mb-2">{t.routeA}</h3>
                                <div className="text-bronze font-bold text-xs uppercase tracking-widest mb-4">{t.routeASub}</div>
                                <p className="text-sm text-white/50 group-hover:text-white/70 transition-colors flex-grow">"{t.routeADesc}"</p>
                            </button>

                            <button onClick={() => onSelectFlow('B')} className="glass-panel p-6 text-left rounded-2xl flex flex-col group hover:border-white/30 transition-all duration-300 relative overflow-hidden cursor-pointer">
                                <h3 className="text-xl font-heading font-bold text-white uppercase tracking-wider mb-2">{t.routeB}</h3>
                                <div className="text-white/50 font-bold text-xs uppercase tracking-widest mb-4">{t.routeBSub}</div>
                                <p className="text-sm text-white/50 group-hover:text-white/70 transition-colors flex-grow">"{t.routeBDesc}"</p>
                            </button>

                            <a href={`mailto:KASTON.PROYECTOS@GMAIL.COM?subject=${encodeURIComponent(language === 'en' ? 'DO YOU NEED TO CHANGE AND INSTALL A STRUCTURE?' : '¿NECESITA CAMBIAR E INSTALAR ESTRUCTURA?')}&body=${encodeURIComponent(language === 'en' ? 'PLEASE SPECIFY YOUR PROJECT SO WE CAN ADVISE YOU, TELL US ABOUT YOUR CASE AND PROVIDE MEASUREMENTS' : 'ESPECIFIQUENOS SU PROYECTO PARA NOSOTROS ASESORARLOS, CUENTENOS DEL CASO DENOS MEDIDAS')}`} className="glass-panel p-6 text-left rounded-2xl flex flex-col group hover:border-bronze/30 transition-all duration-300 relative overflow-hidden cursor-pointer no-underline">
                                <h3 className="text-xl font-heading font-bold text-white uppercase tracking-wider mb-2">{t.routeC}</h3>
                                <div className="text-bronze/70 font-bold text-xs uppercase tracking-widest mb-4">{t.routeCSub}</div>
                                <p className="text-sm text-white/50 group-hover:text-white/70 transition-colors flex-grow">"{t.routeCDesc}"</p>
                                <div className="mt-4 text-[10px] text-bronze/60 uppercase tracking-widest font-bold border-t border-bronze/20 pt-3">→ KASTON.PROYECTOS@GMAIL.COM</div>
                            </a>
                        </div>
                    </div>
                </div>
            )
        }
